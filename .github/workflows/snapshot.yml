name: snapshot

# The images' Debian snapshot, bumped weekly, with each extension's lock where a library it bundles moved: a PR
# you merge by hand, so its images build when you dispatch them at its branch. A PR opened with GITHUB_TOKEN
# starts no workflow of its own.
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.bump.outputs.branch }}
      pinned: ${{ steps.bump.outputs.pinned }}
      latest: ${{ steps.bump.outputs.latest }}
    env:
      CONF: images/mkosi.conf.d/debian/mkosi.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: bump
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^Snapshot=//p' "$CONF")
          latest=$(curl -sSf "https://snapshot.debian.org/mr/timestamp/?archive=debian&after=$pinned" \
            | jq -r '.result.debian | last // empty')
          if [ -z "$latest" ] || [ "$latest" = "$pinned" ]; then
            echo "$pinned is the latest snapshot"
            exit 0
          fi
          branch="snapshot/$latest"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch is already open"
            exit 0
          fi
          sed -i "s/^Snapshot=.*/Snapshot=$latest/" "$CONF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -am "chore(images): Debian snapshot $latest"
          git push -q origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  lock:
    needs: bump
    if: needs.bump.outputs.branch != ''
    permissions:
      contents: write
    uses: ./.github/workflows/lock.yml
    with:
      ref: ${{ needs.bump.outputs.branch }}
      branch: ${{ needs.bump.outputs.branch }}

  pr:
    needs: [bump, lock]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      BRANCH: ${{ needs.bump.outputs.branch }}
      PINNED: ${{ needs.bump.outputs.pinned }}
      LATEST: ${{ needs.bump.outputs.latest }}
      MOVED: ${{ needs.lock.outputs.moved }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -euo pipefail
          locked="${MOVED:+ $MOVED moved with it, so will be rebuilt once each releases by its tag.}"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "chore(images): Debian snapshot $LATEST" --body \
            "Every image's packages from Debian's snapshot of $LATEST, not $PINNED: both architectures bake again.$locked

          Its images build when you dispatch them: \`gh workflow run images.yml --ref $BRANCH\`. It lands by squash."
