name: trains

# Each extension's vendor train against its lock, daily: a release there is locked again in a PR you merge by
# hand, and released by its tag. Debian's own packages move with the snapshot's PR instead. A PR opened with
# GITHUB_TOKEN starts no workflow of its own.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A train's index alone, which needs no tree: whether any package the lock holds of it is another version there
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      moved: ${{ steps.check.outputs.moved }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: check
        shell: python3 {0}
        run: |
          import datetime, os, pathlib, subprocess, tomllib, urllib.request

          catalog = tomllib.loads(pathlib.Path("images/images.toml").read_text())
          extensions = tomllib.loads(pathlib.Path("images/extensions.toml").read_text())
          lock = tomllib.loads(pathlib.Path("images/extensions.lock").read_text())
          debian = {"x86-64": "amd64", "arm64": "arm64"}

          def stanzas(path):
              for stanza in path.read_text().strip().split("\n\n"):
                  yield dict(line.split(": ", 1) for line in stanza.splitlines())

          moved = []
          for name, entry in extensions.items():
              sources = pathlib.Path(f"images/mkosi.profiles/{name}/sandbox/etc/apt/sources.list.d")
              for image in entry["images"]:
                  locked = dict(line.split("=", 1) for line in lock[name][image]["packages"])
                  for path in sorted(sources.glob("*.sources")):
                      for source in stanzas(path):
                          for suite in source["Suites"].split():
                              for component in source["Components"].split():
                                  url = (f"{source['URIs']}/dists/{suite}/{component}/"
                                         f"binary-{debian[catalog[image]['architecture']]}/Packages")
                                  index = urllib.request.urlopen(url, timeout=30).read().decode()
                                  for package in index.split("\n\n"):
                                      fields = dict(l.split(": ", 1) for l in package.splitlines() if ": " in l and l[0] != " ")
                                      if fields.get("Package") in locked and fields["Version"] != locked[fields["Package"]]:
                                          print(f"{name} over {image}: {fields['Package']} {locked[fields['Package']]} -> {fields['Version']}")
                                          moved.append(name)
          branch = f"extensions/{datetime.datetime.now(datetime.UTC):%Y%m%d}"
          if moved and subprocess.run(["git", "ls-remote", "--exit-code", "--heads", "origin", branch],
                                      capture_output=True).returncode == 0:
              print(f"{branch} is already open")
              moved = []
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"moved={'true' if moved else 'false'}\nbranch={branch}\n")

  lock:
    needs: check
    if: needs.check.outputs.moved == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/lock.yml
    with:
      ref: ${{ github.sha }}
      branch: ${{ needs.check.outputs.branch }}

  pr:
    needs: [check, lock]
    if: needs.lock.outputs.moved != ''
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      BRANCH: ${{ needs.check.outputs.branch }}
      MOVED: ${{ needs.lock.outputs.moved }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.check.outputs.branch }}
          fetch-depth: 2
      - run: |
          set -euo pipefail
          gh pr create --base main --head "$BRANCH" --title "chore(images): lock $MOVED again" --body \
            "A vendor's train moved, so $MOVED will be rebuilt:

          \`\`\`diff
          $(git diff --unified=0 HEAD~1 -- images/extensions.lock | tail -n +5)
          \`\`\`

          Each releases by its tag, \`extension/<name>/<version>\`, once this lands. It lands by squash."
