name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv run pytest

  tofu:
    name: tofu fmt + validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: tofu fmt -check -recursive tofu/
      - name: cluster files against their schema
        run: uvx check-jsonschema --schemafile tofu/platform/proxmox/clusters/schema.json tofu/platform/proxmox/clusters/*.yaml
      # A layer with workspaces is one per cluster, so it is validated against every one
      - name: validate every layer
        run: |
          set -euo pipefail
          for layer in $(find tofu -name tofu.tf -not -path '*/.terraform/*' -printf '%h\n' | sort); do
            echo "::group::$layer"
            tofu -chdir="$layer" init -backend=false -input=false
            if grep -q workspace_key_prefix "$layer/tofu.tf"; then
              for cluster in tofu/platform/proxmox/clusters/*.yaml; do
                TF_WORKSPACE="$(basename "$cluster" .yaml)" tofu -chdir="$layer" validate
              done
            else
              tofu -chdir="$layer" validate
            fi
            echo "::endgroup::"
          done

  yamllint:
    name: yamllint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx yamllint -s .

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # ansible-lint pulls ansible-core in, but ansible-galaxy ships with core itself.
      - run: uvx --from ansible-core ansible-galaxy collection install -r ansible/requirements.yml
      - run: uvx --from ansible-core ansible-galaxy role install -r ansible/requirements.yml -p ansible/roles
      - working-directory: ansible
        run: uvx ansible-lint
