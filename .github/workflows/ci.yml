name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv run pytest

  tofu:
    name: tofu fmt + validate
    runs-on: ubuntu-26.04
    env:
      HOMELAB_STATE_PASSPHRASE: ci-validate-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: tofu fmt -check -recursive tofu/
      - name: cluster files against their schema
        run: uvx check-jsonschema --schemafile tofu/clusters/schema.json tofu/clusters/*.yaml
      - name: validate the admin tree against every cluster
        run: |
          set -euo pipefail
          for layer in $(find tofu/admin -name tofu.tf -printf '%h\n' | sort); do
            echo "::group::$layer"
            tofu -chdir="$layer" init -backend=false -input=false
            for cluster in tofu/clusters/*.yaml; do
              name=$(basename "$cluster" .yaml)
              echo "--- $name"
              TF_WORKSPACE="$name" tofu -chdir="$layer" validate
            done
            echo "::endgroup::"
          done

      - name: validate every workload
        run: |
          set -euo pipefail
          for wl in $(find tofu/workloads -name tofu.tf -printf '%h\n' | sort); do
            echo "::group::$wl"
            tofu -chdir="$wl" init -backend=false -input=false
            tofu -chdir="$wl" validate
            echo "::endgroup::"
          done

      - name: validate every AWS layer
        run: |
          set -euo pipefail
          for layer in $(find tofu/aws -name tofu.tf -printf '%h\n' | sort); do
            echo "::group::$layer"
            tofu -chdir="$layer" init -backend=false -input=false
            tofu -chdir="$layer" validate
            echo "::endgroup::"
          done

  yamllint:
    name: yamllint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx yamllint -s .

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # ansible-lint pulls ansible-core in, but ansible-galaxy ships with core itself.
      - run: uvx --from ansible-core ansible-galaxy collection install -r ansible/requirements.yml
      - run: uvx --from ansible-core ansible-galaxy role install -r ansible/requirements.yml -p ansible/roles
      - working-directory: ansible
        run: uvx ansible-lint
