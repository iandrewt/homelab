name: images

on:
  push:
    branches: [main]
    tags: ["image/**"]
    paths: &paths
      - images/**
      - ansible/baseline.yml
      - ansible/baseline/**
      - ansible/collections/**
      - ansible/requirements.yml
      - tools/src/homelab/image/**
      - tools/src/homelab/render/seed.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/images.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tag, image/<image>/<version>, builds and releases that image; anything else builds every image in
  # images.toml, each on a runner of its own architecture, over the one bake its architecture shares
  plan:
    runs-on: ubuntu-26.04
    outputs:
      bakes: ${{ steps.plan.outputs.bakes }}
      builds: ${{ steps.plan.outputs.builds }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - id: plan
        shell: python3 {0}
        run: |
          import json, os, pathlib, subprocess, sys, tomllib

          catalog = tomllib.loads(pathlib.Path("images/images.toml").read_text())
          release = os.environ["GITHUB_REF"].startswith("refs/tags/image/")
          if release:
              wanted, _, version = os.environ["GITHUB_REF_NAME"].removeprefix("image/").rpartition("/")
          else:
              wanted, version = None, "dev"
          runners = {"x86-64": "ubuntu-26.04", "arm64": "ubuntu-24.04-arm"}
          builds = []
          for image, entry in catalog.items():
              if wanted and image != wanted:
                  continue
              # Its build signs with keys of its own until it signs with KMS
              if release and any("\nVerity=signed" in pathlib.Path(f"images/mkosi.profiles/{p}/mkosi.conf").read_text()
                                 for p in entry["profiles"]):
                  sys.exit(f"::error::{image} is image-based, and isn't released until it signs with KMS")
              builds.append({"image": image, "architecture": entry["architecture"],
                             "runner": runners[entry["architecture"]]})
          if not builds:
              sys.exit(f"::error::{wanted} is not an image in images/images.toml")
          # A bake's cache key is what homelab would bake it from, so a bake it restores is current
          inputs = {a: subprocess.run(["uv", "run", "homelab", "image", "bake", "--inputs", a], check=True,
                                      capture_output=True, text=True).stdout.strip()
                    for a in {b["architecture"] for b in builds}}
          for b in builds:
              b["inputs"] = inputs[b["architecture"]]
          bakes = [{"architecture": a, "runner": runners[a], "inputs": inputs[a]} for a in sorted(inputs)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\nbuilds={json.dumps(builds)}\nbakes={json.dumps(bakes)}\n")

  # Cached by what a bake is a function of, so a change to a family or target doesn't bake again
  bake:
    name: bake ${{ matrix.architecture }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.bakes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # The tar and its stamp alone: the bake's disk is sparse, and wouldn't be restored so
          path: &bake-path |
            ~/.cache/homelab/images/output/bake_${{ matrix.architecture }}.tar
            ~/.cache/homelab/images/output/bake_${{ matrix.architecture }}.inputs
          key: &bake-key bake-${{ matrix.architecture }}-${{ matrix.inputs }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      # The bake boots it under KVM where the runner offers it, emulated where it doesn't
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ls -l /dev/kvm || echo "no KVM here"
          uv run ansible-galaxy collection install -r ansible/requirements.yml
          uv run ansible-galaxy role install -p ansible/roles \
            -r ansible/collections/ansible_collections/homelab/debian/requirements.yml
          uv run homelab image bake "${{ matrix.architecture }}"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *bake-path
          key: *bake-key

  build:
    name: ${{ matrix.image }}
    needs: [plan, bake]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *bake-path
          key: *bake-key
          fail-on-cache-miss: true
      # The test boots it under KVM where the runner offers it, emulated where it doesn't
      - run: ls -l /dev/kvm || echo "no KVM here"

      - run: |
          uv run ansible-galaxy collection install -r ansible/requirements.yml
          uv run ansible-galaxy role install -p ansible/roles \
            -r ansible/collections/ansible_collections/homelab/debian/requirements.yml
      - run: uv run homelab image build "${{ matrix.image }}" --version "${{ needs.plan.outputs.version }}"
      - run: uv run homelab image test "${{ matrix.image }}"
      - if: startsWith(github.ref, 'refs/tags/image/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.image }}
          path: ~/.cache/homelab/images/${{ matrix.image }}/${{ matrix.image }}.*
          retention-days: 1

  # Signed keylessly, as the fleet is: SHA256SUMS's signature names this workflow, and the sums the rest
  release:
    if: startsWith(github.ref, 'refs/tags/image/')
    needs: [plan, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    env:
      IMAGE: ${{ fromJSON(needs.plan.outputs.builds)[0].image }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ env.IMAGE }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - run: |
          set -euo pipefail
          for file in "$IMAGE".*; do mv "$file" "$IMAGE-$VERSION.${file#"$IMAGE".}"; done
          # A raw image, to write to a card, goes compressed
          if [ -f "$IMAGE-$VERSION.raw" ]; then xz --threads=0 "$IMAGE-$VERSION.raw"; fi
          sha256sum "$IMAGE-$VERSION".* > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$IMAGE $VERSION" \
            --notes "Built from $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/images.md" \
            "$IMAGE-$VERSION".* SHA256SUMS SHA256SUMS.sigstore.json
