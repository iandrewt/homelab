name: images

on:
  push:
    branches: [main]
    tags: ["image/**"]
    paths: &paths
      - images/**
      - ansible/baseline.yml
      - ansible/baseline/**
      - ansible/collections/**
      - ansible/requirements.yml
      - tools/src/homelab/image/**
      - tools/src/homelab/render/seed.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/images.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tag, image/<profile>/<version>, builds and releases that profile; anything else builds them all,
  # each on a runner of its own architecture
  plan:
    runs-on: ubuntu-26.04
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: plan
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/image/* ]]; then
            tag=${GITHUB_REF_NAME#image/}
            profiles=${tag%/*}
            echo "version=${tag##*/}" >> "$GITHUB_OUTPUT"
          else
            profiles=$(ls images/*/mkosi.conf | cut -d/ -f2)
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
          for profile in $profiles; do
            case $(sed -n 's/^Architecture=//p' "images/$profile/mkosi.conf") in
              x86-64) runner=ubuntu-26.04 ;;
              arm64) runner=ubuntu-24.04-arm ;;
            esac
            jq -cn --arg profile "$profile" --arg runner "$runner" '{$profile, $runner}'
          done | jq -cs '"builds=\(.)"' -r >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.profile }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      # The bake and the test boot it under KVM where the runner offers it, emulated where it doesn't
      - run: ls -l /dev/kvm || echo "no KVM here"

      - run: |
          uv run ansible-galaxy collection install -r ansible/requirements.yml
          uv run ansible-galaxy role install -p ansible/roles \
            -r ansible/collections/ansible_collections/homelab/debian/requirements.yml
      - run: uv run homelab image build "${{ matrix.profile }}" --version "${{ needs.plan.outputs.version }}"
      - run: uv run homelab image test "${{ matrix.profile }}"
      - if: startsWith(github.ref, 'refs/tags/image/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.profile }}
          path: ~/.cache/homelab/images/${{ matrix.profile }}/${{ matrix.profile }}.*
          retention-days: 1

  # Signed keylessly, as the fleet is: SHA256SUMS's signature names this workflow, and the sums the rest
  release:
    if: startsWith(github.ref, 'refs/tags/image/')
    needs: [plan, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    env:
      PROFILE: ${{ fromJSON(needs.plan.outputs.builds)[0].profile }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ env.PROFILE }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - run: |
          set -euo pipefail
          for file in "$PROFILE".*; do mv "$file" "$PROFILE-$VERSION.${file#"$PROFILE".}"; done
          # A raw image, to write to a card, goes compressed
          if [ -f "$PROFILE-$VERSION.raw" ]; then xz --threads=0 "$PROFILE-$VERSION.raw"; fi
          sha256sum "$PROFILE-$VERSION".* > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$PROFILE $VERSION" \
            --notes "Built from $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/images.md" \
            "$PROFILE-$VERSION".* SHA256SUMS SHA256SUMS.sigstore.json
