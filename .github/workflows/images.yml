name: images

on:
  push:
    branches: [main]
    tags: ["image/**", "extension/**"]
    paths: &paths
      - images/**
      - ansible/baseline.yml
      - ansible/baseline/**
      - ansible/collections/**
      - ansible/requirements.yml
      # What an extension holds of a role's, and the roles the resolver tests prove
      - ansible/roles/*/files/**
      - ansible/roles/frr_bgp/**
      - ansible/roles/powerdns_resolver/**
      - ansible/tests/**
      - tools/src/homelab/image/**
      - tools/src/homelab/render/seed.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/images.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# A release's run waits for its promotion's approval, so nothing at a tag cancels it
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  AWS_REGION: ap-southeast-2
  # The release key, and the role that signs with it once the seed activates a run: platform/aws/signing's
  HOMELAB_IMAGES_KEY: arn:aws:kms:ap-southeast-2:837357551240:alias/images
  IMAGES_RELEASE_ROLE: arn:aws:iam::837357551240:role/images-release
  # What writes the update bucket, and where machines read it: platform/aws/images's
  IMAGES_PUBLISH_ROLE: arn:aws:iam::585242447535:role/images-publish
  IMAGES_BUCKET: images-585242447535-ap-southeast-2-an
  IMAGES_UPDATE_URL: https://d3mmebre0rx3rz.cloudfront.net

jobs:
  # A tag, image/<image>/<version>, builds and releases that image, and extension/<extension>/<version> that
  # extension, at the version its lock holds. Anything else builds every image in images.toml, unless all it
  # changes is extensions', and checks each extension's lock still resolves over the images as it lays them
  # out, each on a runner of its image's architecture, over the one bake its architecture shares
  plan:
    runs-on: ubuntu-slim
    outputs:
      bakes: ${{ steps.plan.outputs.bakes }}
      builds: ${{ steps.plan.outputs.builds }}
      locks: ${{ steps.plan.outputs.locks }}
      resolvers: ${{ steps.plan.outputs.resolvers }}
      extensions: ${{ steps.plan.outputs.extensions }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - id: plan
        shell: python3 {0}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          import json, os, pathlib, re, subprocess, sys, tomllib

          catalog = tomllib.loads(pathlib.Path("images/images.toml").read_text())
          extensions = tomllib.loads(pathlib.Path("images/extensions.toml").read_text())
          lock = tomllib.loads(pathlib.Path("images/extensions.lock").read_text())
          ref, name = os.environ["GITHUB_REF"], os.environ["GITHUB_REF_NAME"]
          runners = {"x86-64": "ubuntu-26.04", "arm64": "ubuntu-24.04-arm"}
          release = ref.startswith("refs/tags/image/")
          wanted, version = None, "dev"
          if release:
              wanted, _, version = name.removeprefix("image/").rpartition("/")
          locks, released = [], []
          if ref.startswith("refs/tags/extension/"):
              extension, _, version = name.removeprefix("extension/").rpartition("/")
              if extension not in extensions:
                  sys.exit(f"::error::{extension} is not an extension in images/extensions.toml")
              if lock.get(extension, {}).get("version") != version:
                  sys.exit(f"::error::the lock holds {extension} {lock.get(extension, {}).get('version')}, not {version}")
              released = [{"extension": extension, "image": image} for image in extensions[extension]["images"]]
          elif not ref.startswith("refs/tags/"):
              locks = [{"image": image} for image in sorted({i for e in extensions.values() for i in e["images"]})]

          # What only extensions read, which no image is built from: on: paths is what any is
          only_theirs = re.compile(r"images/(extensions\.lock|vendors/.*|mkosi\.profiles/(%s)/.*)$"
                                   r"|ansible/roles/[^/]+/files/|tools/src/homelab/image/extension\.py$"
                                   % "|".join(map(re.escape, [*extensions, "sysext"])))
          inputs_of_images = re.compile(r"(images/|ansible/baseline|ansible/collections/|ansible/requirements\.yml$"
                                        r"|ansible/roles/[^/]+/files/"
                                        r"|tools/src/homelab/image/|tools/src/homelab/render/seed\.py$|pyproject\.toml$"
                                        r"|uv\.lock$|\.github/workflows/images\.yml$)")
          # What the resolver tests run on: their roles, what a ymir host takes, and ymir and its extensions
          resolvers_read = re.compile(r"ansible/(roles/(frr_bgp|powerdns_resolver)/|tests/|baseline"
                                      r"|collections/ansible_collections/homelab/linux/roles/(extensions|host|host_firewall)/)"
                                      r"|images/(extensions\.|vendors/|mkosi\.conf$|mkosi\.conf\.d/(debian|packages|ymir-vm)"
                                      r"|mkosi\.profiles/(ymir|vm|%s)/)"
                                      r"|tools/src/homelab/image/|\.github/workflows/images\.yml$"
                                      % "|".join(map(re.escape, [*extensions, "sysext"])))
          base = os.environ.get("BASE", "")
          changed = None
          if not ref.startswith("refs/tags/") and base and set(base) != {"0"}:
              changed = subprocess.run(["git", "diff", "--name-only", base, "HEAD"], check=True,
                                       capture_output=True, text=True).stdout.split()
          # A change only extensions or the resolver roles read builds no image
          extensions_alone = changed is not None and not any(
              inputs_of_images.match(p) and not only_theirs.match(p) for p in changed)
          resolvers = []
          if not ref.startswith("refs/tags/") and (changed is None or any(resolvers_read.match(p) for p in changed)):
              # Only where a playbook can reach: a board qemu emulates has no network
              resolvers = [{"image": image, "extensions": " ".join(n for n, e in extensions.items() if image in e["images"])}
                           for image in sorted({i for e in extensions.values() for i in e["images"]})
                           if not catalog[image].get("board")]

          builds = []
          for image, entry in catalog.items():
              if (wanted and image != wanted) or released or extensions_alone:
                  continue
              # An image-based release signs with the release key in KMS; any other build, with its own
              signed = release and any("\nVerity=signed" in pathlib.Path(f"images/mkosi.profiles/{p}/mkosi.conf").read_text()
                                       for p in entry["profiles"])
              builds.append({"image": image, "architecture": entry["architecture"],
                             "runner": runners[entry["architecture"]], "format": entry["format"],
                             "sign": "kms" if signed else "test"})
          if wanted and not builds:
              sys.exit(f"::error::{wanted} is not an image in images/images.toml")
          for job in locks + released + resolvers:
              entry = catalog[job["image"]]
              job.update(architecture=entry["architecture"], runner=runners[entry["architecture"]], format=entry["format"])
          # A bake's cache key is what homelab would bake it from, so a bake it restores is current
          inputs = {a: subprocess.run(["uv", "run", "homelab", "image", "bake", "--inputs", a], check=True,
                                      capture_output=True, text=True).stdout.strip()
                    for a in {job["architecture"] for job in builds + locks + released + resolvers}}
          for job in builds + locks + released + resolvers:
              job["inputs"] = inputs[job["architecture"]]
          bakes = [{"architecture": a, "runner": runners[a], "inputs": inputs[a]} for a in sorted(inputs)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in {"version": version, "builds": json.dumps(builds), "bakes": json.dumps(bakes),
                                 "locks": json.dumps(locks), "extensions": json.dumps(released),
                                 "resolvers": json.dumps(resolvers)}.items():
                  out.write(f"{key}={value}\n")

  # Cached by what a bake is a function of, so a change to a family or target doesn't bake again
  bake:
    name: bake ${{ matrix.architecture }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.bakes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # The tar and its stamp alone: the bake's disk is sparse, and wouldn't be restored so
          path: &bake-path |
            ~/.cache/homelab/images/output/bake_${{ matrix.architecture }}.tar
            ~/.cache/homelab/images/output/bake_${{ matrix.architecture }}.inputs
          key: &bake-key bake-${{ matrix.architecture }}-${{ matrix.inputs }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      # The snapshot's packages, the tools tree's among them, downloaded once: snapshot.debian.org throttles
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: &packages-path ~/.cache/homelab/images/packages/cache/apt/archives/*.deb
          key: &packages-key packages-${{ matrix.architecture }}-${{ hashFiles('images/mkosi.conf.d/debian/mkosi.conf') }}
          restore-keys: &packages-older packages-${{ matrix.architecture }}-
      # The bake boots it under KVM where the runner offers it, emulated where it doesn't
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ls -l /dev/kvm || echo "no KVM here"
          uv run ansible-galaxy collection install -r ansible/requirements.yml
          uv run ansible-galaxy role install -p ansible/roles \
            -r ansible/collections/ansible_collections/homelab/debian/requirements.yml
          uv run homelab image bake "${{ matrix.architecture }}"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *bake-path
          key: *bake-key
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *packages-path
          key: *packages-key

  build:
    name: ${{ matrix.image }}
    needs: [plan, bake]
    if: needs.plan.outputs.builds != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Only a job in a release environment can assume the role that signs with the release key
    environment: ${{ matrix.sign == 'kms' && 'image-release' || '' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *bake-path
          key: *bake-key
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *packages-path
          key: *packages-key
          restore-keys: *packages-older
      # The test boots it under KVM where the runner offers it, emulated where it doesn't
      - run: ls -l /dev/kvm || echo "no KVM here"

      - run: |
          uv run ansible-galaxy collection install -r ansible/requirements.yml
          uv run ansible-galaxy role install -p ansible/roles \
            -r ansible/collections/ansible_collections/homelab/debian/requirements.yml
      # The key signs only for a run the seed has activated, and only by credentials issued since
      - name: activation
        if: matrix.sign == 'kms'
        run: &activation |
          echo "::notice::Activate this run to sign: tofu -chdir=tofu/security/aws/seed apply -var 'activate={release=\"$GITHUB_RUN_ID\"}'"
          digest=$(head -c 32 /dev/zero | base64)
          for _ in $(seq 60); do
            token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
            if credentials=$(aws sts assume-role-with-web-identity --role-arn "$IMAGES_RELEASE_ROLE" \
                --web-identity-token "$token" --role-session-name "$GITHUB_RUN_ID-activation" --query Credentials --output json); then
              refusal=$(AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<< "$credentials") \
                AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<< "$credentials") \
                AWS_SESSION_TOKEN=$(jq -r .SessionToken <<< "$credentials") \
                aws kms sign --key-id "$HOMELAB_IMAGES_KEY" --message "$digest" --message-type DIGEST \
                  --signing-algorithm RSASSA_PKCS1_V1_5_SHA_256 --dry-run 2>&1 >/dev/null) || true
              [[ $refusal == *DryRunOperation* ]] && exit 0
            fi
            sleep 30
          done
          echo "::error::Not activated within 30 minutes"
          exit 1
      # Platform's role writes the bucket, as the profile publish names; Signing's signs, as the environment
      - if: matrix.sign == 'kms'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.IMAGES_PUBLISH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          aws-profile: images-publish
      - if: matrix.sign == 'kms'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.IMAGES_RELEASE_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          uv run homelab image build "${{ matrix.image }}" --version "${{ needs.plan.outputs.version }}" \
            --sign "${{ matrix.sign }}"
      - run: uv run homelab image test "${{ matrix.image }}" --sign "${{ matrix.sign }}"
      # An image-based release goes to its canary channel, and to stable once its promotion's approved
      - if: matrix.sign == 'kms'
        run: uv run homelab image publish "${{ matrix.image }}"
      - if: startsWith(github.ref, 'refs/tags/image/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.image }}
          # What a release ships: the image as it's taken, its packages, and the keyring its updates are checked by
          path: |
            ~/.cache/homelab/images/${{ matrix.image }}/${{ matrix.image }}.${{ matrix.format }}
            ~/.cache/homelab/images/${{ matrix.image }}/${{ matrix.image }}.packages
            ~/.cache/homelab/images/${{ matrix.image }}/keys/tree/usr/lib/systemd/import-pubring.pgp
          retention-days: 1

  # Attested by the workflow: SLSA provenance for every file SHA256SUMS names, which `gh attestation verify` checks
  release:
    if: startsWith(github.ref, 'refs/tags/image/')
    needs: [plan, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ fromJSON(needs.plan.outputs.builds)[0].image }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ env.IMAGE }}
      - run: |
          set -euo pipefail
          # An image-based one's: what bootstrap pi and images/secure-boot/updates.pgp check its sums by
          keyring=keys/tree/usr/lib/systemd/import-pubring.pgp
          shipped=()
          if [ -f "$keyring" ]; then mv "$keyring" updates.pgp; shipped=(updates.pgp); fi
          rm -rf keys
          for file in "$IMAGE".*; do mv "$file" "$IMAGE-$VERSION.${file#"$IMAGE".}"; done
          # A raw image, to write to a card, goes compressed
          if [ -f "$IMAGE-$VERSION.raw" ]; then xz --threads=0 "$IMAGE-$VERSION.raw"; fi
          sha256sum "$IMAGE-$VERSION".* "${shipped[@]}" > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      - run: &publish |
          set -euo pipefail
          mapfile -t files < <(awk '{print $2}' SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$(basename "$(dirname "$GITHUB_REF_NAME")") $VERSION" \
            --notes "Built from $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/images.md" \
            "${files[@]}" SHA256SUMS

  # A lock that no longer resolves fails here, before it reaches main: `homelab image extension lock` locks
  # it again, at its next version, which its tag releases
  lock:
    name: lock over ${{ matrix.image }}
    needs: [plan, bake]
    if: needs.plan.outputs.locks != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.locks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *bake-path
          key: *bake-key
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *packages-path
          key: *packages-key
          restore-keys: *packages-older
      - run: uv run homelab image extension lock --check --image "${{ matrix.image }}"

  # The resolvers' roles on a booted image, taking its extensions as this change builds them, as a primary
  # and a secondary, each run twice: only where something they read changed
  resolvers:
    name: resolvers on ${{ matrix.image }}
    needs: [plan, bake]
    if: needs.plan.outputs.resolvers != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.resolvers) }}
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *bake-path
          key: *bake-key
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *packages-path
          key: *packages-key
          restore-keys: *packages-older
      - run: uv run ansible-galaxy collection install -r ansible/requirements.yml
      - run: uv run homelab image build "$IMAGE"
      - run: for extension in ${{ matrix.extensions }}; do uv run homelab image extension build "$extension" --image "$IMAGE"; done
      - run: ls -l /dev/kvm || echo "no KVM here"
      - run: >-
          uv run homelab image extension test "$IMAGE"
          --playbook ansible/tests/resolver-primary.yml --playbook ansible/tests/resolver-secondary.yml
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: resolvers-${{ matrix.image }}
          path: ~/.cache/homelab/images/${{ matrix.image }}/*.log
          retention-days: 7

  # An extension's release: built over each of its images, tested on the newest release of the image, as its
  # machines run it, and published to the image's canary channel for it
  extension:
    name: ${{ matrix.extension }} over ${{ matrix.image }}
    needs: [plan, bake]
    if: needs.plan.outputs.extensions != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: extension-release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.extensions) }}
    env:
      EXTENSION: ${{ matrix.extension }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *bake-path
          key: *bake-key
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *packages-path
          key: *packages-key
          restore-keys: *packages-older
      - name: activation
        run: *activation
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.IMAGES_PUBLISH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          aws-profile: images-publish
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.IMAGES_RELEASE_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: uv run homelab image extension build "$EXTENSION" --image "$IMAGE" --sign kms
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep "^image/$IMAGE/" | sort -V | tail -1)
          echo "testing on $tag"
          disk=~/.cache/homelab/images/"$IMAGE/$IMAGE.${{ matrix.format }}"
          mkdir -p "$(dirname "$disk")"
          # A raw image, for a card, ships compressed
          if [ "${{ matrix.format }}" = raw ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$IMAGE-*.raw.xz" --output - | xz -d > "$disk"
          else
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$IMAGE-*.${{ matrix.format }}" --output "$disk"
          fi
      - run: ls -l /dev/kvm || echo "no KVM here"
      - run: uv run homelab image extension test "$IMAGE" "$EXTENSION"
      - run: uv run homelab image extension publish "$EXTENSION" --image "$IMAGE"
      # Named by its image, as its release ships it beside its other images'
      - run: |
          mkdir release
          for file in ~/.cache/homelab/images/"$IMAGE"/extensions/"$EXTENSION"/*.{raw,packages}; do
            cp "$file" "release/$EXTENSION-${{ needs.plan.outputs.version }}-$IMAGE.${file##*.}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.extension }}-${{ matrix.image }}
          path: release/*
          retention-days: 1

  extension-release:
    if: startsWith(github.ref, 'refs/tags/extension/')
    needs: [plan, extension]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      EXTENSION: ${{ fromJSON(needs.plan.outputs.extensions)[0].extension }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ${{ env.EXTENSION }}-*
          merge-multiple: true
      - run: sha256sum "$EXTENSION-$VERSION"-* > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      - run: *publish

  # Once canary has served it: approving this deployment, then activating the run again, since the stable
  # channel's sums are signed again
  promote:
    needs: [plan, release, extension-release]
    if: >-
      !cancelled() && !failure() && (needs.extension-release.result == 'success' ||
      (needs.release.result == 'success' && fromJSON(needs.plan.outputs.builds)[0].sign == 'kms'))
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: ${{ startsWith(github.ref, 'refs/tags/extension/') && 'extension-promote' || 'image-promote' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: activation
        run: *activation
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.IMAGES_PUBLISH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          aws-profile: images-publish
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.IMAGES_RELEASE_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          kind="${GITHUB_REF_NAME%%/*}" release="${GITHUB_REF_NAME#*/}"
          if [ "$kind" = extension ]; then
            uv run homelab image extension promote "${release%/*}" "${release##*/}"
          else
            uv run homelab image promote "${release%/*}" "${release##*/}"
          fi
