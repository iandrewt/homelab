name: tofu

# Every changed Terramate stack tagged ci, in Terramate's order. A pull request is planned from main's copy of this
# file, only if every commit is the operator's. On main, one job plans and keeps the plans, and another applies
# exactly those once the run is activated. Every role pins this file on main
on:
  pull_request_target:
    paths: ["tofu/**"]
  push:
    branches: [main]
    paths: ["tofu/**"]
  workflow_dispatch:

permissions: {}

# One run on main at a time, never cancelled mid-apply; a pull request's newest push supersedes its plan
concurrency:
  group: tofu-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  AWS_REGION: ap-southeast-2
  MANAGEMENT: "615824167099"
  # Terramate's selection: the changed stacks tagged ci, all of them when dispatched by hand
  TM_ARG_TAGS: ci
  TM_ARG_CHANGED: ${{ github.event_name != 'workflow_dispatch' }}
  TM_ARG_GIT_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: tofu-plan-org
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.check.outputs.changes }}
      accounts: ${{ steps.credentials.outputs.accounts }}
    steps:
      # Tools and policy come from main; a pull request's checkout only supplies its tofu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: main
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: code
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name != 'pull_request_target'
        run: ln -s main code

      # A pull request's tofu runs against state that holds secrets, so only the operator's commits, or
      # Dependabot's signed by GitHub, are planned. The operator's primary key, whichever subkey signs
      - name: every commit is the operator's
        if: github.event_name == 'pull_request_target'
        working-directory: code
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          OPERATOR: B657C0C18BB7049D0F29AD2502FEFD0A7B59B580
          DEPENDABOT: 49699333+dependabot[bot]@users.noreply.github.com
        run: |
          GNUPGHOME=$(mktemp -d) && export GNUPGHOME
          gpg -q --import ../main/.github/signing-key.asc
          refused=0
          while IFS='|' read -r sha status primary author; do
            [[ $status =~ ^[GU]$ && $primary == "$OPERATOR" ]] && continue
            [[ $author == "$DEPENDABOT" &&
              $(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" -q .commit.verification.verified) == true ]] && continue
            echo "::error::$sha isn't signed by the operator's key"
            refused=1
          done < <(git log --format='%H|%G?|%GP|%ae' "$BASE..HEAD")
          exit $refused

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.14
          working_directory: main

      # tofu-plan in every account and every team's state role, the roles a person plans as, from one token
      - name: credentials
        id: credentials
        working-directory: main
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          profile() {
            aws sts assume-role-with-web-identity --role-arn "$2" --web-identity-token "$token" \
              --role-session-name "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --query Credentials --output json |
              jq -r --arg name "$1" '"[\($name)]\naws_access_key_id = \(.AccessKeyId)\naws_secret_access_key = \(.SecretAccessKey)\naws_session_token = \(.SessionToken)\n"' \
                >> ~/.aws/credentials
          }
          mkdir -p ~/.aws
          profile homelab-management-plan "arn:aws:iam::$MANAGEMENT:role/org/tofu-plan"
          accounts=$(aws organizations list-accounts --profile homelab-management-plan --query 'Accounts[].[Name,Id]' --output json |
            jq -c --slurpfile names <(for f in tofu/platform/aws/accounts/*.yaml; do
                jq -n --arg slug "$(basename "$f" .yaml)" --arg name "$(sed -n 's/^name: //p' "$f")" '{$slug, $name}'; done) '
              map({key: .[0], value: .[1]}) | from_entries as $ids
              | [$names[] | select($ids[.name]) | {key: .slug, value: $ids[.name]}] | from_entries')
          echo "accounts=$accounts" >> "$GITHUB_OUTPUT"
          for slug in $(jq -r 'keys[]' <<< "$accounts"); do
            profile "homelab-$slug-plan" "arn:aws:iam::$(jq -r --arg s "$slug" '.[$s]' <<< "$accounts"):role/org/tofu-plan"
          done
          for team in tofu/identity/tenancy/teams/*.yaml; do
            team=$(basename "$team" .yaml)
            profile "homelab-state-$team" "arn:aws:iam::$(jq -r '.["tofu-state"]' <<< "$accounts"):role/tofu-state/tofu-state-$team"
          done

      - working-directory: code
        run: terramate run -- tofu init -input=false -no-color

      - working-directory: code
        run: terramate run -- tofu plan -input=false -no-color -lock-timeout=5m -out=tfplan

      # main's policy against every plan, and whether any changes anything
      - name: check
        id: check
        working-directory: code
        run: |
          refused=0
          while IFS= read -r -d '' plan; do
            stack=$(dirname "$plan")
            json=$(tofu -chdir="$stack" show -json tfplan)
            conftest test --no-color --policy ../main/tofu/policy - <<< "$json" || refused=1
            if jq -e '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length > 0' <<< "$json" >/dev/null; then
              echo "changes=true" >> "$GITHUB_OUTPUT"
              { echo "### ${stack#tofu/}"; echo '```'; tofu -chdir="$stack" show -no-color tfplan; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(find tofu -name tfplan -not -path '*/.terraform/*' -print0)
          exit $refused

      # Encrypted with the state key
      - if: github.event_name != 'pull_request_target' && steps.check.outputs.changes
        working-directory: code
        run: find tofu -name tfplan -not -path '*/.terraform/*' -print0 | tar --null -cf "$RUNNER_TEMP/plans.tar" -T -

      - if: github.event_name != 'pull_request_target' && steps.check.outputs.changes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: plans
          path: ${{ runner.temp }}/plans.tar
          retention-days: 1
          if-no-files-found: error

  apply:
    needs: plan
    if: github.event_name != 'pull_request_target' && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: tofu-org
    permissions:
      contents: read
      id-token: write
    env:
      ACCOUNTS: ${{ needs.plan.outputs.accounts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: code
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: plans
          path: ${{ runner.temp }}

      - working-directory: code
        run: tar -xf "$RUNNER_TEMP/plans.tar"

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.14
          working_directory: code

      # deploy-org holds nothing until the run is activated: bootstrap in any member answers whether it is
      - name: activation
        run: |
          echo "::notice::Read this run's plans, then: tofu -chdir=tofu/security/aws/seed apply -var 'activate={org=\"$GITHUB_RUN_ID\"}'"
          canary=$(jq -r 'to_entries[0].value' <<< "$ACCOUNTS")
          for _ in $(seq 60); do
            token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
            if credentials=$(aws sts assume-role-with-web-identity --role-arn "arn:aws:iam::$MANAGEMENT:role/deploy-org" \
                --web-identity-token "$token" --role-session-name "$GITHUB_RUN_ID-activation" --query Credentials --output json) &&
              AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<< "$credentials") \
              AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<< "$credentials") \
              AWS_SESSION_TOKEN=$(jq -r .SessionToken <<< "$credentials") \
              aws sts assume-role --role-arn "arn:aws:iam::$canary:role/OrganizationAccountAccessRole" \
                --role-session-name "$GITHUB_RUN_ID-activation" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::Not activated within 30 minutes"
          exit 1

      # deploy-org and every team's state role, from one token; bootstrap in every member chained from deploy-org,
      # since bootstrap trusts only management
      - name: credentials
        working-directory: code
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          profile() {
            aws sts assume-role-with-web-identity --role-arn "$2" --web-identity-token "$token" \
              --role-session-name "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --query Credentials --output json |
              jq -r --arg name "$1" '"[\($name)]\naws_access_key_id = \(.AccessKeyId)\naws_secret_access_key = \(.SecretAccessKey)\naws_session_token = \(.SessionToken)\n"' \
                >> ~/.aws/credentials
          }
          mkdir -p ~/.aws
          profile homelab-management "arn:aws:iam::$MANAGEMENT:role/deploy-org"
          for team in tofu/identity/tenancy/teams/*.yaml; do
            team=$(basename "$team" .yaml)
            profile "homelab-state-$team" "arn:aws:iam::$(jq -r '.["tofu-state"]' <<< "$ACCOUNTS"):role/tofu-state/tofu-state-$team"
          done
          jq -r --arg session "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 'to_entries[] |
            "[profile homelab-\(.key)-bootstrap]\nrole_arn = arn:aws:iam::\(.value):role/OrganizationAccountAccessRole\nsource_profile = homelab-management\nrole_session_name = \($session)\n"' \
            <<< "$ACCOUNTS" >> ~/.aws/config

      - working-directory: code
        run: terramate run -- tofu init -input=false -no-color

      - working-directory: code
        run: terramate run -- tofu apply -input=false -no-color tfplan
