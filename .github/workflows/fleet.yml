name: fleet

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  ARTIFACT: ghcr.io/${{ github.repository_owner }}/homelab-fleet

jobs:
  push:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a  # v2.10.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The next patch's pre-release: above the last release, below its own
      - name: version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${last#v}"
          echo "version=$major.$minor.$((patch + 1))-rc.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # `homelab fleet` reads the revision, to bootstrap from the same commit
      - name: push and sign
        run: |
          set -euo pipefail
          digest=$(flux push artifact "oci://$ARTIFACT:${{ steps.version.outputs.version }}" \
            --path=./kubernetes \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="$GITHUB_REF_NAME@sha1:$GITHUB_SHA" \
            --output=json | jq -r .digest)
          cosign sign --yes "$ARTIFACT@$digest"
