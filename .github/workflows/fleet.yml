name: fleet

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  ARTIFACT: ghcr.io/${{ github.repository_owner }}/homelab-fleet

jobs:
  push:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39  # v2.9.6
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The next patch's pre-release: above the last release, below its own
      - name: version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${last#v}"
          echo "version=$major.$minor.$((patch + 1))-rc.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # `homelab fleet` reads the revision, to bootstrap from the same commit
      - name: push and sign
        run: |
          set -euo pipefail
          digest=$(flux push artifact "oci://$ARTIFACT:${{ steps.version.outputs.version }}" \
            --path=./kubernetes \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="$GITHUB_REF_NAME@sha1:$GITHUB_SHA" \
            --output=json | jq -r .digest)
          cosign sign --yes "$ARTIFACT@$digest"
