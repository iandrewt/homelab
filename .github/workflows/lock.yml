name: lock

# `homelab image extension lock` over every image an extension is built on, each on a runner of its
# architecture, the images' locks joined and pushed to a branch: what trains.yml and snapshot.yml open their PRs
# from. A push with GITHUB_TOKEN starts no workflow of its own.
on:
  workflow_call:
    inputs:
      ref:
        description: What to lock again
        type: string
        required: true
      branch:
        description: Where the lock goes, from ref
        type: string
        required: true
    outputs:
      moved:
        description: The extensions locked again, empty if none moved
        value: ${{ jobs.join.outputs.moved }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      bakes: ${{ steps.plan.outputs.bakes }}
      locks: ${{ steps.plan.outputs.locks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - id: plan
        shell: python3 {0}
        run: |
          import json, os, pathlib, subprocess, tomllib

          catalog = tomllib.loads(pathlib.Path("images/images.toml").read_text())
          extensions = tomllib.loads(pathlib.Path("images/extensions.toml").read_text())
          runners = {"x86-64": "ubuntu-26.04", "arm64": "ubuntu-24.04-arm"}
          images = sorted({i for e in extensions.values() for i in e["images"]})
          inputs = {a: subprocess.run(["uv", "run", "homelab", "image", "bake", "--inputs", a], check=True,
                                      capture_output=True, text=True).stdout.strip()
                    for a in {catalog[i]["architecture"] for i in images}}
          bakes = [{"architecture": a, "runner": runners[a], "inputs": inputs[a]} for a in sorted(inputs)]
          locks = [{"image": i, **next(b for b in bakes if b["architecture"] == catalog[i]["architecture"])}
                   for i in images]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"bakes={json.dumps(bakes)}\nlocks={json.dumps(locks)}\n")

  # images.yml's bake, under its keys, so a bake either makes serves the other
  bake:
    name: bake ${{ matrix.architecture }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.bakes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: &bake-path |
            ~/.cache/homelab/images/output/bake_${{ matrix.architecture }}.tar
            ~/.cache/homelab/images/output/bake_${{ matrix.architecture }}.inputs
          key: &bake-key bake-${{ matrix.architecture }}-${{ matrix.inputs }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: &packages-path ~/.cache/homelab/images/packages/cache/apt/archives/*.deb
          key: &packages-key packages-${{ matrix.architecture }}-${{ hashFiles('images/mkosi.conf.d/debian/mkosi.conf') }}
          restore-keys: &packages-older packages-${{ matrix.architecture }}-
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv run ansible-galaxy collection install -r ansible/requirements.yml
          uv run ansible-galaxy role install -p ansible/roles \
            -r ansible/collections/ansible_collections/homelab/debian/requirements.yml
          uv run homelab image bake "${{ matrix.architecture }}"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *bake-path
          key: *bake-key
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *packages-path
          key: *packages-key

  lock:
    name: lock over ${{ matrix.image }}
    needs: [plan, bake]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.locks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *bake-path
          key: *bake-key
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: *packages-path
          key: *packages-key
          restore-keys: *packages-older
      - run: uv run homelab image extension lock --image "${{ matrix.image }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lock-${{ matrix.image }}
          path: images/extensions.lock
          retention-days: 1

  # Each image's entries from its own runner's lock, and the version from whichever moved: every runner bumps
  # from the same lock, so two that moved agree
  join:
    needs: [plan, lock]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      moved: ${{ steps.join.outputs.moved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: lock-*
          path: ${{ runner.temp }}/locks
      - id: join
        shell: uv run python {0}
        env:
          LOCKS: ${{ runner.temp }}/locks
        run: |
          import os, pathlib, sys, tomllib
          from homelab.image.extension import read_lock, write_lock

          images = pathlib.Path("images")
          lock = read_lock(images)
          moved = {}
          for path in sorted(pathlib.Path(os.environ["LOCKS"]).glob("lock-*/extensions.lock")):
              image = path.parent.name.removeprefix("lock-")
              for name, theirs in tomllib.loads(path.read_text()).items():
                  ours = lock.setdefault(name, {})
                  if image not in theirs or theirs[image] == ours.get(image):
                      continue
                  if moved.setdefault(name, theirs["version"]) != theirs["version"]:
                      sys.exit(f"::error::{name}'s images moved it to {moved[name]} and {theirs['version']}")
                  ours.update(version=theirs["version"], **{image: theirs[image]})
          if moved:
              write_lock(images, lock)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"moved={' '.join(sorted(moved))}\n")
      - if: steps.join.outputs.moved != ''
        env:
          BRANCH: ${{ inputs.branch }}
          MOVED: ${{ steps.join.outputs.moved }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -q -am "chore(images): lock $MOVED again"
          git push -q origin "$BRANCH"
