version: 2
updates:
  - package-ecosystem: "opentofu"
    directories:
      - "/tofu/**/*"
    schedule:
      interval: "weekly"
    groups:
      tofu:
        group-by: dependency-name

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
