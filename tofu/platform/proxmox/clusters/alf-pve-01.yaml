# yaml-language-server: $schema=schema.json
site: alfheim
# Substrate, so by site: a record per node in NetBox, and a client takes whichever answers
endpoint: https://alf-pve-01.alfheim.infra.titmuss.zone:8006/
# Self-signed until the private CA exists
insecure: true

onepassword_vault: Platform
onepassword_break_glass_vault: Break-glass

timezone: Australia/Sydney
mailto: pve@titmuss.house
release: 9
# Proxmox's OUI and a nibble per cell, the longest prefix Proxmox takes
mac_prefix: "BC:24:11:1"
sdn:
  bridge: vmbr0
  mtu: 9000

storages:
  # The installer's, which the cluster layer adopts. Nothing a tenant writes is on a node
  local:
    type: directory
    path: /var/lib/vz
    content: [iso]

  images:
    type: nfs
    server: san.alf-pve-01.alfheim.infra.titmuss.zone
    export: /mnt/tank/infra/proxmox
    options: vers=4.2
    content: [import, iso, vztmpl]

  backups:
    type: nfs
    server: san.alf-pve-01.alfheim.infra.titmuss.zone
    export: /mnt/tank/backups/proxmox
    options: vers=4.2
    content: [backup]

  # A storage per tenant, on tank/<tenant>: Ansible makes the dataset and sets its quota
  tank:
    type: zfspool
    pool: tank
    tenants: true
    content: [images, rootdir]

  nvme:
    type: zfspool
    pool: nvme
    content: [images]

guest_defaults:
  disk_storage: tank

backup:
  storage: backups
  schedule: sat 02:00
  retention:
    keep-weekly: 4

# Their pools are the host's: Ansible's, in each node's host_vars
nodes:
  yggdrasil: {}

image_storage: images

mappings:
  pci:
    arc-a40:
      comment: Intel Arc Pro A40
      devices:
        yggdrasil:
          path: "0000:46:00.0"
          id: "8086:56b1"
          subsystem_id: "8086:1210"
          iommu_group: 17

tenants:
  network:
    vnets: [services]

  platform:
    vnets: [shared, shrdsan]
    mappings: [arc-a40]
