# yaml-language-server: $schema=schema.json
site: alfheim
endpoint: https://yggdrasil.alfheim.titmuss.zone:8006/

onepassword_vault: Platform
onepassword_break_glass_vault: Break-glass

ssh_username: tofu
timezone: Australia/Sydney
mailto: pve@titmuss.house
mac_prefix: "BC:24:11"
sdn:
  bridge: vmbr0
  mtu: 9000

firewall:
  management_vlans: [Management, Trusted]

oidc:
  realm: entra
  issuer_url: https://login.microsoftonline.com/5b506f80-57e1-4fda-864e-c2da64b16fd1/v2.0
  client_id: 997138dc-e3d4-440e-89d9-8043c0c3455a
  comment: Entra ID

storages:
  local:
    type: directory
    path: /var/lib/vz
    content: [snippets]

  images:
    type: nfs
    server: mimir.alfheim.titmuss.zone
    export: /mnt/tank/infra/proxmox
    options: vers=4.2
    content: [import, iso, vztmpl]

  backups:
    type: nfs
    server: mimir.alfheim.titmuss.zone
    export: /mnt/tank/backups/proxmox
    options: vers=4.2
    content: [backup]

  tank:
    type: zfspool
    pool: tank
    content: [images, rootdir]

  nvme:
    type: zfspool
    pool: nvme
    content: [images]

guest_defaults:
  disk_storage: tank
  snippet_storage: local

backup:
  storage: backups
  schedule: sat 02:00
  retention:
    keep-weekly: 4

nodes:
  yggdrasil:
    pools:
      tank:
        raidlevel: raid10
        devices:
          - /dev/disk/by-id/wwn-0x5002538fc242310d
          - /dev/disk/by-id/wwn-0x5002538fc24230c7
          - /dev/disk/by-id/wwn-0x5002538fc2423113
          - /dev/disk/by-id/wwn-0x5002538fc24230cb
      nvme:
        raidlevel: single
        devices:
          - /dev/disk/by-id/nvme-eui.0025385301b095c0

image_storage: images
images:
  debian-13-genericcloud:
    url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
    file_name: debian-13-genericcloud-amd64.qcow2
    content_type: import
    # TODO: pin a checksum

tenants:
  network:
    comment: "The Network team."
    vnets: [servers]

  # Each integration is something running inside a workload that needs its own
  # Proxmox credentials. It gets a user, a privsep token, and one role per ACL entry -
  # a Proxmox ACL grants a role on a path, so privileges are declared per path.
  # platform:
  #   comment: "The Platform team."
  #   vnets: [k8s, storage]
  #   integrations:
  #     csi:
  #       comment: "proxmox-csi-plugin: provisions and attaches PVs."
  #       acls:
  #         /pool/platform/talos: [VM.Audit, VM.Config.Disk]
  #         /storage/nvme: [Datastore.Allocate, Datastore.AllocateSpace, Datastore.Audit]
  #     ccm:
  #       comment: "proxmox-cloud-controller-manager: labels nodes with their topology."
  #       acls:
  #         /pool/platform/talos: [VM.Audit]
