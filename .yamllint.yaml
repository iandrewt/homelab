extends: default

rules:
  line-length: disable
  document-start: disable
  comments-indentation: disable
  truthy:
    check-keys: false
  braces:
    min-spaces-inside: 1
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0

ignore: |
  .terraform/
  tofu/**/.terraform/
  .ansible/
  ansible/roles/DEBIAN13-CIS/
  ansible/roles/PowerDNS.*/
