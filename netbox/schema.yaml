# NetBox's schema: what every consumer in this repo reads NetBox by, the same in anyone's
# NetBox. `homelab netbox plan` shows what differs from it, and `apply` makes it so. Allocations
# - prefixes, VLANs, addresses, sessions, devices - are NetBox's, and never here. Everything is
# Network's unless it says otherwise; tenants come from tofu/identity/tenancy/teams/.
