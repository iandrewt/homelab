dns_views:
  _default_:
    description: ''
  public:
    description: What octoDNS publishes to Cloudflare and Route53
routing_policies:
  NOTHING:
    rules:
      10: deny
# `tcp_md5`: a password on the group's listen ranges, which every speaker on them must be able
# to sign with - a Raspberry Pi's kernel can't
peer_groups:
  SERVICES:
    export_policies:
      - NOTHING
    extra_attributes:
      keepalive: 3
      holdtime: 9
      tcp_md5: false
  KUBERNETES-NODES:
    export_policies:
      - NOTHING
    extra_attributes:
      keepalive: 3
      holdtime: 9
      tcp_md5: false
  KUBERNETES-NODES-V6:
    export_policies:
      - NOTHING
    extra_attributes:
      keepalive: 3
      holdtime: 9
      tcp_md5: false
# Who may do what, applied only with `apply --identity` and an admin's token, since whoever can
# grant a permission can grant themselves any. A user per consumer, so the changelog says
# which; its token, made by hand and kept in 1Password, can do only what its groups can
groups:
  readers:
    description: Every consumer that reads NetBox
  schema:
    description: Keeps NetBox's schema
users:
  homelab:
    groups:
      - readers
  ansible-network:
    groups:
      - readers
  ansible-platform:
    groups:
      - readers
  tofu-network:
    groups:
      - readers
  tofu-platform:
    groups:
      - readers
  schema:
    groups:
      - readers
      - schema
permissions:
  Read everything:
    description: Every public type but who may do what
    # `*` is every public type NetBox has, plugins' included, but those excepted
    object_types:
      - '*'
    except:
      - users.user
      - users.group
      - users.objectpermission
      - users.token
      - users.userconfig
    actions:
      - view
    groups:
      - readers
  Change the schema:
    description: The types netbox/schema.yaml states
    object_types:
      - users.ownergroup
      - users.owner
      - tenancy.tenantgroup
      - tenancy.tenant
      - ipam.rir
      - ipam.role
      - extras.tag
      - extras.customfield
      - virtualization.clustertype
      - ipam.asnrange
      - ipam.servicetemplate
      - netbox_dns.view
      - netbox_bgp.routingpolicy
      - netbox_bgp.routingpolicyrule
      - netbox_bgp.bgppeergroup
    actions:
      - add
      - change
      - delete
    groups:
      - schema
