# Source of truth for the network. Validated against schema.json in CI.

ipv4_supernet: 10.176.0.0/14
ipv6_ula_supernet: "fd1b:134f:fb00::/40"

domains:
  public: titmuss.au
  internal: titmuss.zone
  household: titmuss.house

# VLAN 1 (UniFi's forced default network) isn't here -- no device is ever placed on it,
# and its addressing is a fixed exception (a /30 for the console, no IPv6), not formulaic.
vlans:
  management: { id: 10, ula: true, gua: false }
  servers: { id: 20, ula: true, gua: true }
  trusted: { id: 30, ula: true, gua: true }
  iot: { id: 40, ula: true, gua: true }
  lab: { id: 50, ula: true, gua: true }
  camera: { id: 60, ula: true, gua: false }
  work: { id: 70, ula: false, gua: true }
  guest: { id: 80, ula: false, gua: true }
  dmz: { id: 90, ula: false, gua: true }

sites:
  alfheim:
    index: 0
    status: planned
    vlans: [management, servers, trusted, iot, lab, camera, work, guest, dmz]
    gua_prefix: "2001:db8:cca5::/48"
  vanaheim:
    index: 1
    status: planned
    description: spoke site
    vlans: [management, trusted, iot, guest]
    gua_prefix: null  # TODO: own ISP-delegated /56

# Pets: physical hosts and singleton guests. Norse names.
hosts:
  yggdrasil:
    site: alfheim
    vlan: management
    kind: physical
    role: hypervisor
    status: planned
    ipv4: 10.176.10.10
    ipv6: "fd1b:134f:fb00:10::10"
