[project]
name = "homelab-tools"
version = "0.1.0"
description = "Rendering and syncing from NetBox, the source of truth."
requires-python = ">=3.14"

dependencies = [
    "octodns>=1.22",
    "octodns-cloudflare>=1.0",
    "octodns-netbox-dns>=0.3.19",
    "octodns-powerdns>=1.2",
    "octodns-route53>=1.0",
    "onepassword-sdk>=0.4.1",
    "pynetbox>=7.4",
    "pyyaml>=6.0",
    "tomli-w>=1.2",
]

[project.scripts]
homelab = "homelab:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# `uv run ansible-playbook` needs homelab importable, for ansible/vars_plugins/netbox.py
default-groups = ["dev", "ansible"]

[tool.uv.build-backend]
module-name = "homelab"
module-root = "tools/src"

[dependency-groups]
ansible = [
    "ansible-core>=2.21",
    "pytz>=2026.3.post1",
]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
