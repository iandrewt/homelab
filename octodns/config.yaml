# NetBox's internal view to each site's primary. Run through `homelab dns plan` and
# `homelab dns apply`, which add a PowerDNS target per site - its resolver tagged
# `dns-primary` - and fill in the env/ values from 1Password.
manager:
  enable_checksum: true
  plan_outputs:
    markdown:
      class: octodns.provider.plan.PlanMarkdown

providers:
  netbox:
    class: octodns_netbox_dns.NetBoxDNSProvider
    url: env/NETBOX_URL
    token: env/NETBOX_TOKEN
    view: _default_
    make_absolute: true
    ns_ttl_mode: record

zones:
  "*":
    sources: [netbox]
