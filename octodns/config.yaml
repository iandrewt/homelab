# NetBox's internal view to each site's primary. Run through `homelab dns plan` and
# `homelab dns apply`, which fill in the env/ values from 1Password.
manager:
  enable_checksum: true
  plan_outputs:
    markdown:
      class: octodns.provider.plan.PlanMarkdown

providers:
  netbox:
    class: octodns_netbox_dns.NetBoxDNSProvider
    url: env/NETBOX_URL
    token: env/NETBOX_TOKEN
    view: _default_
    make_absolute: true
    ns_ttl_mode: record

  # One per site, named by its slug: its API key is "<slug> PowerDNS API key".
  alfheim:
    class: octodns_powerdns.PowerDnsProvider
    host: ratatoskr-dns.alfheim.titmuss.zone
    api_key: env/ALFHEIM_POWERDNS_API_KEY
    enable_dynamic: false

zones:
  "*":
    sources: [netbox]
    targets: [alfheim]
