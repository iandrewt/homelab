router bgp 65000
 bgp router-id 10.176.0.1
 neighbor RESOLVERS peer-group
 neighbor RESOLVERS remote-as 65010
 neighbor 10.176.20.11 peer-group RESOLVERS
 neighbor 10.176.20.11 description hugin
 neighbor 10.176.20.12 peer-group RESOLVERS
 neighbor 10.176.20.12 description ratatoskr
 !
 address-family ipv4 unicast
  neighbor RESOLVERS activate
  neighbor RESOLVERS route-map FROM-RESOLVERS in
  maximum-paths 8
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor RESOLVERS activate
  neighbor RESOLVERS route-map FROM-RESOLVERS-V6 in
  maximum-paths 8
 exit-address-family
!
ip prefix-list ANYCAST-DNS-V4 seq 5 permit 10.176.240.53/32
!
route-map FROM-RESOLVERS permit 10
 match ip address prefix-list ANYCAST-DNS-V4
exit
!
ipv6 prefix-list ANYCAST-DNS-V6 seq 5 permit fd1b:134f:fb00:ff00::53/128
ipv6 prefix-list ANYCAST-DNS-V6 seq 10 permit 2001:db8:cca5:ff00::53/128
!
route-map FROM-RESOLVERS-V6 permit 10
 match ipv6 address prefix-list ANYCAST-DNS-V6
exit
