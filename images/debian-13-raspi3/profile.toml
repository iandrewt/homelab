# How the build and the boot test boot it in qemu, beyond what its mkosi.conf says

# By its kernel and initrd: qemu has no Raspberry Pi firmware
firmware = false
# Where NoCloud finds its seed: "partition", its own firmware partition, labelled CIDATA
seed = "partition"
# What a release ships, to write to a card
format = "raw"
# qemu's virt machine names its serial console ttyAMA0; on the Pi, raspi-firmware writes cmdline.txt
cmdline = "root=LABEL=root ro console=ttyAMA0 lsm=landlock,lockdown,yama,apparmor,bpf audit=1 audit_backlog_limit=8192"
