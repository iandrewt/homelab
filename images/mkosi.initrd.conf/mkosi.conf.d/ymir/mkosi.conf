# ymir's initrd: guarding /var's mount point, seeding repart with the machine-id, rebooting rather than
# stopping at a shell. Not merging /etc: confext-sysroot can't route writes to a /var not yet mounted,
# and the routing link on root's /var would stop the generator mounting /var over it
[Match]
Profiles=ymir

[Build]
# A release key's client, which a KMS-signed build sets and any other leaves empty: by name, since a subimage
# takes no Environment= of the main image's, and mkosi validates its keys too
Environment=PKCS11_PROVIDER_MODULE P11_KIT_SERVER_ADDRESS
