# The image, laid out over its baked tree (bake/): a signed UKI, and /usr on erofs under verity
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Snapshot=20261102T082611Z

[Output]
Format=disk
ImageId=ymir-amd64-vm
SplitArtifacts=uki,partitions
# OVMF can't read an ESP formatted with 4K sectors on a 512-byte disk
SectorSize=512
RepartDirectories=../ymir/repart

[Content]
Bootable=yes
Bootloader=systemd-boot
# Built here, and signed by SecureBoot=: "signed" means a distribution's own
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v
KernelCommandLine=rw console=tty0 console=ttyS0,115200 lsm=landlock,lockdown,yama,apparmor,bpf audit=1 audit_backlog_limit=8192
CleanPackageMetadata=yes
ExtraTrees=../ymir/tree
PostInstallationScripts=../ymir/postinst.chroot
InitrdPackages=
        libtss2-esys-3.0.2-0t64
        libtss2-mu-4.0.1-0t64
        libtss2-rc0t64
        libtss2-tctildr0t64
        systemd-cryptsetup
        systemd-repart

[Validation]
SecureBoot=yes
SignExpectedPcr=yes
Verity=signed
