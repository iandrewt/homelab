# How the build and the boot test boot it in qemu, beyond what its mkosi.conf says

# Through UEFI with Secure Boot, from its UKI
firmware = true
# Its seed: "drive", a cidata volume of its own, as Proxmox attaches one
seed = "drive"
# Its user-data is systemd credentials, which the image reads itself
cloud_init = false
# What a release ships
format = "qcow2"
# Its disks are sealed to one
tpm = true
# The bake boots bake/'s tree by its kernel, as one root filesystem
cmdline = "root=LABEL=root rw console=ttyS0,115200 lsm=landlock,lockdown,yama,apparmor,bpf audit=1 audit_backlog_limit=8192"
