# The tree the baseline bakes, booted as one root filesystem; ../mkosi.conf lays the image out over it
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Snapshot=20261102T082611Z

[Output]
Format=directory
Output=tree

[Content]
Bootable=no
ExtraTrees=../../shared ../../ymir/base
RemoveFiles=/etc/ssh/ssh_host_*
Packages=
        apt
        ca-certificates
        cryptsetup-bin
        dbus
        dosfstools
        e2fsprogs
        gpg
        initramfs-tools
        libnss-myhostname
        libnss-systemd
        libtss2-esys-3.0.2-0t64
        libtss2-mu-4.0.1-0t64
        libtss2-rc0t64
        libtss2-tctildr0t64
        linux-image-cloud-amd64
        netplan.io
        openssh-server
        python3
        python3-apt
        qemu-guest-agent
        sudo
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-container
        systemd-cryptsetup
        systemd-repart
        systemd-resolved
        systemd-sysv
        udev
        zstd
