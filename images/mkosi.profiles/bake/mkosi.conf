# The distribution's tree, baked by baseline.yml once per architecture: `mkosi vm` boots it with the
# login its credentials make, and every family's image lays over the tar it's sealed into
[Output]
Format=disk
ImageId=bake
Output=bake_%a

[Content]
# For an initrd: the cloud kernel's virtio_blk is a module
Bootable=yes
Bootloader=none
KernelCommandLine=lsm=landlock,lockdown,yama,apparmor,bpf audit=1 audit_backlog_limit=8192
RemoveFiles=/etc/ssh/ssh_host_*
# Debian's own initrd too, which a mutable image boots and apt regenerates; mkosi suppresses it for a
# bootable image
Environment=INITRD=Yes

[Runtime]
Firmware=linux
RAM=2G
