# A system extension: one workload's packages over an image-based image's tree, which the command line names
# (`--base-tree`), holding only what it adds
[Build]
Environment=SYSEXT_SCOPE=system
# A release key's client, which a KMS-signed build sets and any other leaves empty
Environment=PKCS11_PROVIDER_MODULE P11_KIT_SERVER_ADDRESS

[Output]
Format=sysext
Overlay=yes

[Content]
Bootable=no
