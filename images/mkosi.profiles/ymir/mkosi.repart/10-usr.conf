[Partition]
Type=usr
Label=%M_%A
Format=erofs
Compression=lz4hc
CopyFiles=/usr:/
Verity=data
VerityMatchKey=usr
# Its UUID in the file sysupdate fetches, since verity's discovery finds /usr by it
SplitName=%t.%U
# Not the image's 512, which libblkid can't find erofs at, so udev never readies /usr
FileSystemSectorSize=4096
SizeMinBytes=512M
SizeMaxBytes=512M
