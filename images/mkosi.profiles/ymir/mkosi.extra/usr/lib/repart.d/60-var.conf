[Partition]
Type=var
Label=var
Format=ext4
Encrypt=tpm2
MakeDirectories=/log /tmp /lib/extensions.mutable
# Where the confext's mutable mode routes /etc's writes: back to the machine's own /etc
MakeSymlinks=/lib/extensions.mutable/etc:/etc
# What the rest of the disk is, however far its owner grows it
SizeMinBytes=1G
