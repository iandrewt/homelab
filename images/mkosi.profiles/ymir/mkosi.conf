# Image-based: a signed UKI, and /usr on erofs under verity, updated A/B and whole, with systemd from
# forky for what 262 does that 257 doesn't
[Build]
SandboxTrees=sandbox
# A release key's client, which a KMS-signed build sets and any other leaves empty
Environment=PKCS11_PROVIDER_MODULE P11_KIT_SERVER_ADDRESS

[Output]
Format=disk
SplitArtifacts=uki,partitions
# OVMF can't read an ESP formatted with 4K sectors on a 512-byte disk
SectorSize=512

[Content]
BaseTrees=%O/bake_%a.tar
Bootable=yes
Bootloader=systemd-boot
# Built here, and signed by SecureBoot=: "signed" means a distribution's own
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v
KernelCommandLine=rw lsm=landlock,lockdown,yama,apparmor,bpf audit=1 audit_backlog_limit=8192
# Nobody's at its console: first boot takes credentials and asks nothing
KernelCommandLine=systemd.firstboot=headless
Packages=
        cryptsetup-bin
        libsystemd0
        libudev1
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-container
        systemd-cryptsetup
        systemd-repart
        systemd-resolved
        systemd-sysv
        systemd-tpm
        udev
InitrdPackages=
        systemd-cryptsetup
        systemd-repart
        systemd-tpm

[Validation]
SecureBoot=yes
SignExpectedPcr=yes
Verity=signed
