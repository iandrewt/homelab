# One project: an image is the distribution, a family and a target, for an architecture the command line
# names, so every [Match] on it sees it: `mkosi --architecture x86-64 --profile ymir --profile vm build`.
# Builds run as root (the builder), which dpkg's ownership needs
[Distribution]
Distribution=debian

[Build]
# forky's, for systemd 262's ukify and repart
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=forky
# systemd-measure, which ukify signs PCR policies with; and what post-output scripts run: qemu-img for a
# VM's qcow2, sfdisk and rsync for a Pi's MBR
ToolsTreePackages=systemd-tpm qemu-utils fdisk rsync
History=no

[Output]
ManifestFormat=json
ElTorito=no
