# The machine's own /etc is the upper layer: what it writes stays its own, and what it hasn't follows the image
[Service]
ExecStartPre=mkdir -p /var/lib/extensions.mutable
ExecStartPre=ln -sfn /etc /var/lib/extensions.mutable/etc
ExecStart=
ExecStart=systemd-confext refresh --mutable=auto
ExecReload=
ExecReload=systemd-confext refresh --mutable=auto
