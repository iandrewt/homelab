# Package-managed, on Proxmox: Debian's own signed boot chain, and CIS's partitions on GPT, which
# repart grows /var by on first boot as it laid them out at build
[Match]
Profiles=mutable
Profiles=vm
Architecture=x86-64

[Output]
ImageId=debian-13-amd64-vm
Format=disk
RepartDirectories=mkosi.extra/usr/lib/repart.d

[Content]
ExtraTrees=../../secure-boot/auto:/efi/loader/keys/auto
Packages=
        systemd-boot
        systemd-boot-efi-amd64-signed
