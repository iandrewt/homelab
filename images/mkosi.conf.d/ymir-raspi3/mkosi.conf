# ymir, on a Pi 3B: its firmware loads U-Boot, whose EFI loads systemd-boot as a VM's firmware does
[Match]
Profiles=ymir
Profiles=raspi3

[Output]
ImageId=ymir-arm64-raspi3

[Build]
SandboxTrees=sandbox

[Content]
Packages=u-boot-rpi
# The mini UART, where U-Boot writes too: the PL011 is the Bluetooth chip's
KernelCommandLine=console=ttyS1,115200
# What finds and opens its card, not the generic arm64 list, so two versions' UKIs fit the ESP
KernelInitrdModules=
KernelInitrdModules=
        /drivers/mmc/
        /drivers/dma/
        /drivers/firmware/
        /drivers/mailbox/
        /drivers/clk/
        /drivers/pinctrl/
        /drivers/soc/
        /drivers/regulator/
        /drivers/md/
        /fs/ext4/
        /fs/erofs/
        /fs/fat/
        /fs/nls/
        /fs/efivarfs/
        /fs/autofs/
        /drivers/watchdog/bcm2835_wdt
        /lib/
        /crypto/
