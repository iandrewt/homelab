# What the tools tree adds, which nothing baked depends on, so it's no input to the bake: systemd-measure,
# which ukify signs PCR policies with; and what post-output scripts run: qemu-img for a VM's qcow2, sfdisk
# and rsync for a Pi's MBR
[Build]
ToolsTreePackages=systemd-tpm qemu-utils fdisk rsync
# A release's key, by p11-kit's server and client of one release, and the KMS module the server loads
ToolsTreePackages=pkcs11-provider p11-kit p11-kit-modules libcurl4t64
