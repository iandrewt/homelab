[defaults]
# This team's hosts, then what the baseline knows of them
inventory = inventory/netbox.yml, ../baseline
roles_path = ../roles
collections_path = ../collections:~/.ansible/collections:/usr/share/ansible/collections
vars_plugins = ../vars_plugins
vars_plugins_enabled = host_group_vars, netbox, onepassword
lookup_plugins = ../lookup_plugins
host_key_checking = True
interpreter_python = auto_silent
force_handlers = True
no_target_syslog = True
stdout_callback = debug

[homelab]
# NetBox as this team's Ansible user, and the key its hosts trust
netbox_item = op://Platform/NetBox API Token - Ansible
ssh_key = op://Platform/SSH Key - Platform

[ssh_connection]
pipelining = True
# Ansible's own default: one connection per host, so the 1Password agent is asked once per host
# rather than once per task. Held to the host keys NetBox pins, which vars_plugins/netbox.py
# writes there each run, and offering only the team's key, which vars_plugins/onepassword.py writes
ssh_args = -C -o ControlMaster=auto -o ControlPersist=30m -o StrictHostKeyChecking=yes -o UserKnownHostsFile=../.ansible/known_hosts -o IdentitiesOnly=yes
