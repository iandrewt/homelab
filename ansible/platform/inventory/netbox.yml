plugin: netbox.netbox.nb_inventory
validate_certs: true

token: "{{ lookup('secret', 'op://Platform/NetBox API Token - Ansible/credential') }}"

# What Platform owns and allocated to no team: a VM it owns is its tenant's to configure
query_filters:
  - status: active
  - status: staged
  - tag: ansible-managed
  - owner: Platform
  - tenant_id: "null"

groups:
  hypervisor: "role is defined and role.slug == 'hypervisor'"

# By primary address: the hosts that serve DNS can't be reached by a name they serve
ansible_host_dns_name: false
interfaces: true
