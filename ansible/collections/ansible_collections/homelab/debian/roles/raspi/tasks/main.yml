---
- name: Install the Pi's firmware
  ansible.builtin.apt:
    name: raspi-firmware

- name: Name the root and the consoles
  ansible.builtin.copy:
    dest: /etc/default/raspi-firmware
    owner: root
    group: root
    mode: "0644"
    content: |
      ROOTPART={{ raspi_root }}
      CONSOLES="{{ raspi_consoles }}"
  notify: Rewrite the firmware partition

- name: Add the kernel's parameters
  ansible.builtin.copy:
    dest: /etc/default/raspi-extra-cmdline
    owner: root
    group: root
    mode: "0644"
    content: "{{ raspi_cmdline }}\n"
  notify: Rewrite the firmware partition

- name: Add to config.txt
  ansible.builtin.copy:
    dest: /etc/default/raspi-firmware-custom
    owner: root
    group: root
    mode: "0644"
    content: "{{ raspi_config }}"
  notify: Rewrite the firmware partition

- name: Refuse the radios' drivers
  ansible.builtin.copy:
    dest: /etc/modprobe.d/raspi-radios.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      install brcmfmac /bin/false
      install hci_uart /bin/false
  when: not raspi_radios

- name: Let the radios' drivers load
  ansible.builtin.file:
    path: /etc/modprobe.d/raspi-radios.conf
    state: absent
  when: raspi_radios
