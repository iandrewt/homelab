---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Local apt-periodic policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/22auto-upgrades-local
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Local unattended-upgrades policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern {
      {% for origin in hardening_unattended_upgrade_origins + hardening_unattended_upgrade_extra_origins
                       + (['origin=Debian,codename=forky,label=Debian'] if hardening_audit_from_forky else []) %}
          "{{ origin }}";
      {% endfor %}
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::SyslogEnable "true";

- name: Remove packages nothing depends on any more
  ansible.builtin.apt:
    autoremove: true
