---
# PasswordAuthentication and KbdInteractiveAuthentication have no CIS control at all
- name: Harden sshd (key-only)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      {% for key, value in hardening_sshd_options | dictsort %}
      {{ key }} {{ value }}
      {% endfor %}
    validate: sshd -t -f %s
  notify: Restart sshd
