---
- name: Take this OS family's specifics
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags: [always]

- name: Harden sshd (key-only)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      {% for key, value in sshd_options | dictsort %}
      {{ key }} {{ value }}
      {% endfor %}
    validate: sshd -t -f %s
  notify: Restart the SSH server
