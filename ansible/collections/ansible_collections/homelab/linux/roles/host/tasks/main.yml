---
- name: Take this OS family's specifics
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags: [always]

- name: Upgrade schedule
  ansible.builtin.import_tasks: upgrade_schedule.yml
  tags: [upgrades]

- name: Service accounts
  ansible.builtin.import_tasks: service_accounts.yml
  tags: [service_accounts]
