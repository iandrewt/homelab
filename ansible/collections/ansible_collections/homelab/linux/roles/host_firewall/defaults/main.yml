---
# Each {name, protocol, ports, addresses (empty: all the host's), sources: {internet: true} or
# {ipv4, ipv6}}. A rule with no sources admits no one.
host_firewall_rules: []

# What this host can't do without, each {protocol, port, address?}: the role refuses a ruleset
# that admits none of them from anywhere, rather than cut the host off
host_firewall_needed:
  - { protocol: tcp, port: 22 }

# Whether to install nftables, which an image may carry instead
host_firewall_install: true

# How long a ruleset that cut off Ansible stays, before the one it replaced is restored
host_firewall_rollback_seconds: 90
