---
- name: Take this OS family's specifics
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags: [always]

- name: Assert a rule admits each port this host can't do without
  ansible.builtin.assert:
    that:
      - candidates | length > 0
      - >-
        item.address is not defined
        or candidates | selectattr('addresses', 'eq', []) | list | length > 0
        or candidates | selectattr('addresses', 'contains', item.address) | list | length > 0
    fail_msg: >-
      No rule admits {{ item.protocol }} {{ item.port }}{{ ' to ' ~ item.address if item.address is defined }}
      on {{ inventory_hostname }}, so its firewall would refuse it.
    quiet: true
  vars:
    candidates: >-
      {{ host_firewall_rules | selectattr('sources')
         | selectattr('protocol', 'eq', item.protocol) | selectattr('ports', 'contains', item.port) | list }}
  loop: "{{ host_firewall_needed }}"
  when: item.address | default('') is not none

- name: Install nftables
  ansible.builtin.package:
    name: nftables
    state: present

- name: Write the ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ host_firewall_config }}"
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
    backup: true
  register: host_firewall_ruleset

# Now, in order, and before anything else: not a handler at the play's end
- name: Load it, rolled back unless Ansible can still connect afterwards  # noqa: no-handler
  when: host_firewall_ruleset is changed
  block:
    # With no file before it, what it replaced was no ruleset at all
    - name: Restore the ruleset it replaced in a while, unless this is called off
      ansible.builtin.command:
        argv: [systemd-run, "--on-active={{ host_firewall_rollback_seconds }}", --unit=host-firewall-rollback,
               --collect, /bin/sh, -c, "{{ restore }}"]
      vars:
        restore: >-
          {{ 'mv -f ' ~ (host_firewall_ruleset.backup_file | quote) ~ ' ' ~ (host_firewall_config | quote)
             ~ ' && exec /usr/sbin/nft -f ' ~ (host_firewall_config | quote)
             if host_firewall_ruleset.backup_file is defined else
             'rm -f ' ~ (host_firewall_config | quote) ~ ' && exec /usr/sbin/nft flush ruleset' }}
      changed_when: true

    - name: Load the ruleset
      ansible.builtin.systemd_service:
        name: nftables
        state: reloaded

    - name: Drop the connection that conntrack already admits
      ansible.builtin.meta: reset_connection

    - name: Connect again, through the ruleset
      ansible.builtin.wait_for_connection:
        timeout: 30

    - name: Call off the rollback
      ansible.builtin.systemd_service:
        name: host-firewall-rollback.timer
        state: stopped

    - name: Drop the ruleset it replaced
      ansible.builtin.file:
        path: "{{ host_firewall_ruleset.backup_file }}"
        state: absent
      when: host_firewall_ruleset.backup_file is defined

- name: Load it at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
