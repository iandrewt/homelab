---
image_roles:
  - homelab.debian.network
  - homelab.linux.guest_agent

# Updated A/B, whole: there's no package database to upgrade from
hardening_upgrades: false

# grub-only; its UKI's command line is signed
deb13cis_rule_1_3_1_2: false
deb13cis_rule_1_4_2: false
deb13cis_rule_6_2_1_3: false
deb13cis_rule_6_2_1_4: false

# overlayfs is how sysext and confext merge
deb13cis_rule_1_1_1_6: false

# Timers, not cron
deb13cis_rule_2_4_1_1: false
deb13cis_rule_2_4_1_2: false
deb13cis_rule_2_4_1_3: false
deb13cis_rule_2_4_1_4: false
deb13cis_rule_2_4_1_5: false
deb13cis_rule_2_4_1_6: false
deb13cis_rule_2_4_1_7: false
deb13cis_rule_2_4_1_8: false
deb13cis_rule_2_4_1_9: false

# dm-verity checks /usr and the image's /etc on every read, so AIDE, and the mail it sends, go
deb13cis_config_aide: false
deb13cis_rule_6_3_1: false
deb13cis_rule_6_3_2: false
deb13cis_rule_6_3_3: false
