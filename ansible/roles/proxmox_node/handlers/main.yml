---
- name: Apply sysctl
  ansible.builtin.command: sysctl --load /etc/sysctl.d/60-ipv6-addrgen.conf
  changed_when: true

- name: Reload the network
  ansible.builtin.command: ifreload -a
  async: 60
  poll: 5
  changed_when: true

- name: Rebuild the initramfs
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true

- name: Reload the VNet guard
  ansible.builtin.systemd_service:
    name: vnet-guard
    state: restarted
    daemon_reload: true

- name: Restart lldpd
  ansible.builtin.systemd_service:
    name: lldpd
    state: restarted
