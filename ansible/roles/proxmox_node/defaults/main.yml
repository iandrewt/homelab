---
proxmox_node_cluster: "{{ cluster }}"
# Corosync's: the VLAN NetBox puts in the cluster
proxmox_node_corosync: >-
  {{ netbox_site.vlans.values() | selectattr('cluster', 'eq', proxmox_node_cluster) | first }}
proxmox_node_link0: "{{ interfaces | address_in(proxmox_node_corosync.ipv6) }}"

# Every VNet at the site but those the node holds an interface for
proxmox_node_unjoined_vnets: >-
  {{ netbox_site.vlans.values() | map(attribute='vnet') | select
     | reject('in', interfaces | map(attribute='name') | list) | sort }}

proxmox_node_bond:
  miimon: 100
  mode: 802.3ad
  xmit-hash-policy: layer3+4

# Pools by name, each a list of community.general.zpool vdevs
proxmox_node_zpools: {}
# Datasets by path, each a tenant's share of its pool's: what the cell file's split storages sit on
proxmox_node_datasets: {}
