---
proxmox_node_cluster: "{{ cluster }}"
# What Proxmox calls the node: its hostname
proxmox_node_name: "{{ ansible_facts.hostname }}"
# Corosync's: the VLAN NetBox puts in the cluster
proxmox_node_corosync: >-
  {{ netbox_site.vlans.values() | selectattr('cluster', 'eq', proxmox_node_cluster) | first }}
proxmox_node_link0: "{{ interfaces | address_in(proxmox_node_corosync.ipv6) }}"

# Its own bridges and the VNets it joins: every other bridge is a VNet it doesn't, even one
# tofu made since this ran
proxmox_node_held_bridges: >-
  {{ (interfaces | selectattr('type.value', 'eq', 'bridge') | map(attribute='name') | list
      + interfaces | map(attribute='name') | select('in', netbox_site.vlans.values() | map(attribute='vnet') | select | list) | list)
     | unique | sort }}

proxmox_node_lldp: "{{ interfaces | lldp_trunk }}"

proxmox_node_bond:
  miimon: 100
  mode: 802.3ad
  xmit-hash-policy: layer3+4

# Pools by name, each a list of community.general.zpool vdevs
proxmox_node_zpools: {}
# Datasets by path, each a tenant's share of its pool's: what the cell file's split storages sit on
proxmox_node_datasets: {}

# A GPU maker's host drivers, kept off a node NetBox records one of its cards in
proxmox_node_gpu_drivers:
  intel: [i915, xe]
proxmox_node_gpu_blacklist: >-
  {{ netbox_site.gpus.get(inventory_hostname, [])
     | map('extract', proxmox_node_gpu_drivers) | flatten | unique | sort }}
