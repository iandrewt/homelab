---
- name: Repositories and packages
  ansible.builtin.import_tasks: packages.yml
  tags: [packages]

- name: Network
  ansible.builtin.import_tasks: network.yml
  tags: [network]

- name: VNet guard
  ansible.builtin.import_tasks: vnet_guard.yml
  tags: [vnet_guard]

- name: PCI passthrough
  ansible.builtin.import_tasks: passthrough.yml
  tags: [passthrough]

- name: Apply the network before the cluster
  ansible.builtin.meta: flush_handlers

- name: Cluster
  ansible.builtin.import_tasks: cluster.yml
  tags: [cluster]
