---
# A member's routine upgrade, one node at a time (platform/upgrade.yml). Its guests move to another
# node where the cell has one online; a cell of one stops them for the reboot, and starts them again
- name: Find the cell's nodes and guests
  ansible.builtin.command: pvesh get /cluster/resources --output-format json
  register: proxmox_node_resources
  changed_when: false
  check_mode: false

- name: Note what runs here, and where it can go
  ansible.builtin.set_fact:
    proxmox_node_running: >-
      {{ proxmox_node_resources.stdout | from_json | selectattr('type', 'in', ['qemu', 'lxc'])
         | selectattr('node', 'eq', proxmox_node_name) | selectattr('status', 'eq', 'running')
         | map(attribute='vmid') | list }}
    proxmox_node_target: >-
      {{ proxmox_node_resources.stdout | from_json | selectattr('type', 'eq', 'node')
         | rejectattr('node', 'eq', proxmox_node_name) | selectattr('status', 'eq', 'online')
         | map(attribute='node') | first | default('') }}

- name: Move its guests to another node
  ansible.builtin.command: pvenode migrateall {{ proxmox_node_target }} --with-local-disks 1
  when: proxmox_node_target | length > 0 and proxmox_node_running | length > 0
  changed_when: true

- name: Upgrade it
  ansible.builtin.apt:
    upgrade: full
    update_cache: true

- name: Find the newest kernel it boots
  ansible.builtin.shell: set -o pipefail && ls -1v /boot/vmlinuz-* | tail -n 1
  args:
    executable: /bin/bash
  register: proxmox_node_newest_kernel
  changed_when: false
  check_mode: false

- name: Check whether a package asks for a reboot
  ansible.builtin.stat:
    path: /run/reboot-required
  register: proxmox_node_reboot_required

- name: Reboot into what it upgraded
  ansible.builtin.reboot:
    reboot_timeout: 1800
  when: >-
    proxmox_node_reboot_required.stat.exists
    or proxmox_node_newest_kernel.stdout != '/boot/vmlinuz-' ~ ansible_facts.kernel

- name: Wait until the cell is quorate again
  ansible.builtin.command: pvesh get /cluster/status --output-format json
  register: proxmox_node_quorum
  until: >-
    proxmox_node_quorum.rc == 0 and proxmox_node_quorum.stdout | from_json | selectattr('type', 'eq', 'cluster')
    | map(attribute='quorate') | first | default(0) == 1
  retries: 60
  delay: 10
  changed_when: false
  check_mode: false
  when: proxmox_node_target | length > 0

# Where nothing moved, what ran before has to run again, by its own on_boot, before the next node.
# Read once pvesh answers: pve-cluster starts after the node does
- name: Wait for its guests to run again
  ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
  register: proxmox_node_after
  until: >-
    proxmox_node_after.rc == 0 and proxmox_node_after.stdout | from_json | selectattr('type', 'in', ['qemu', 'lxc'])
    | selectattr('vmid', 'in', proxmox_node_running)
    | selectattr('status', 'eq', 'running') | list | length == proxmox_node_running | length
  retries: 60
  delay: 10
  changed_when: false
  check_mode: false
  when: proxmox_node_target | length == 0
