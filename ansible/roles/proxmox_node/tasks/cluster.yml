---
- name: Find the nodes of this cluster
  ansible.builtin.set_fact:
    proxmox_node_peers: >-
      {{ groups['hypervisor'] | map('extract', hostvars) | selectattr('cluster', 'defined')
         | selectattr('cluster', 'eq', proxmox_node_cluster)
         | map(attribute='inventory_hostname') | sort }}

# Delegated, so a run limited to a new node still sees the members
- name: Check which of them are already in it
  ansible.builtin.stat:
    path: /etc/pve/corosync.conf
  delegate_to: "{{ item }}"
  loop: "{{ proxmox_node_peers }}"
  register: proxmox_node_membership

- name: Pick the member to join through - the first node, if nobody is in it yet
  ansible.builtin.set_fact:
    proxmox_node_members: "{{ members }}"
    proxmox_node_member: "{{ members | first | default(proxmox_node_peers | first) }}"
  vars:
    members: >-
      {{ proxmox_node_membership.results | selectattr('stat.exists')
         | map(attribute='item') | list }}

# Facts predate the network this run wrote, and corosync binds only once DAD is done with it
- name: Wait for the corosync address
  ansible.builtin.command: ip -6 -o addr show to {{ proxmox_node_link0 }}
  register: proxmox_node_link0_state
  until: proxmox_node_link0_state.stdout and 'tentative' not in proxmox_node_link0_state.stdout
  retries: 15
  delay: 2
  changed_when: false
  check_mode: false

- name: Create the cluster on its first node
  ansible.builtin.command: pvecm create {{ proxmox_node_cluster }} --link0 {{ proxmox_node_link0 }}
  args:
    creates: /etc/pve/corosync.conf
  when:
    - proxmox_node_members | length == 0
    - inventory_hostname == proxmox_node_member

# Tasks run across every host before the next starts, so a fresh cluster's first node
# has created it by the time the others get here. Joining is over SSH, as root from node to
# node, so nothing here needs a root password.
- name: Read this node's root key, which Proxmox made at install
  ansible.builtin.slurp:
    src: /root/.ssh/id_rsa.pub
  register: proxmox_node_root_key
  when: &joining
    - inventory_hostname not in proxmox_node_members
    - inventory_hostname != proxmox_node_member

- name: Let it in to the member, through the cluster's own authorized_keys
  ansible.posix.authorized_key:
    user: root
    path: /etc/pve/priv/authorized_keys
    manage_dir: false
    key: "{{ proxmox_node_root_key.content | b64decode }}"
  delegate_to: "{{ proxmox_node_member }}"
  when: *joining

- name: Read the member's host key
  ansible.builtin.slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  delegate_to: "{{ proxmox_node_member }}"
  register: proxmox_node_member_host_key
  when: *joining

- name: Trust it from this node
  ansible.builtin.known_hosts:
    name: "{{ hostvars[proxmox_node_member].primary_ip6 }}"
    key: "{{ hostvars[proxmox_node_member].primary_ip6 }} {{ proxmox_node_member_host_key.content | b64decode }}"
    path: /root/.ssh/known_hosts
  when: *joining

- name: Join the cluster
  ansible.builtin.command:
    argv:
      - pvecm
      - add
      - "{{ hostvars[proxmox_node_member].primary_ip6 }}"
      - --use_ssh
      - "1"
      - --link0
      - "{{ proxmox_node_link0 }}"
    creates: /etc/pve/corosync.conf
  when: *joining
