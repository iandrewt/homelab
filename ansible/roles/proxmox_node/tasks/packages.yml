---
- name: Disable the enterprise repositories
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    enabled: false
    types: deb
    uris: "https://enterprise.proxmox.com/debian/{{ item.path }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: "{{ item.component }}"
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
  loop:
    - { name: pve-enterprise, path: pve, component: pve-enterprise }
    - { name: ceph, path: ceph-squid, component: enterprise }
  loop_control:
    label: "{{ item.name }}"
  register: proxmox_node_enterprise

- name: Use the no-subscription repository
  ansible.builtin.deb822_repository:
    name: pve-no-subscription
    types: deb
    uris: http://download.proxmox.com/debian/pve
    suites: "{{ ansible_facts.distribution_release }}"
    components: pve-no-subscription
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
  register: proxmox_node_no_subscription

- name: Advertise the node over LLDP
  ansible.builtin.apt:
    name: lldpd
    update_cache: "{{ proxmox_node_enterprise is changed or proxmox_node_no_subscription is changed }}"

# A node joins at the cell's level whatever ISO it came from. Only before it joins: a
# member's guests have to move off first
- name: Check whether the node is in a cluster yet
  ansible.builtin.stat:
    path: /etc/pve/corosync.conf
  register: proxmox_node_clustered

- name: Upgrade the node before it joins
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  when: not proxmox_node_clustered.stat.exists

- name: Find the newest kernel it boots
  ansible.builtin.shell: set -o pipefail && ls -1v /boot/vmlinuz-* | tail -n 1
  args:
    executable: /bin/bash
  register: proxmox_node_newest_kernel
  changed_when: false
  check_mode: false
  when: not proxmox_node_clustered.stat.exists

- name: Boot it before joining
  ansible.builtin.reboot:
  when:
    - not proxmox_node_clustered.stat.exists
    - proxmox_node_newest_kernel.stdout != '/boot/vmlinuz-' ~ ansible_facts.kernel
