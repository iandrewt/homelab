---
debian_host_timezone: Australia/Sydney

debian_host_ssh_password_auth: false
debian_host_sshd_options: {}

# Machine accounts: {name, ssh_key, comment?, shell?, sudo_commands?}.
debian_host_service_accounts: []

debian_host_unattended_upgrade_origins:
  - "origin=Debian,codename=${distro_codename},label=Debian"
  - "origin=Debian,codename=${distro_codename},label=Debian-Security"
  - "origin=Debian,codename=${distro_codename}-security,label=Debian-Security"

# Hour (0-23) apt-daily-upgrade.timer should fire. Unset: 06:00.
debian_host_upgrade_hour: ~

debian_host_use_netplan: true
debian_host_primary_interface: eth0
