---
- name: Assert every service account has a key to authorise
  ansible.builtin.assert:
    that:
      - item.ssh_key is not none
      - item.ssh_key | length > 0
    fail_msg: >-
      Service account {{ item.name }} has no ssh_key - it would exist with no way in.
      Check its reference in inventory/onepassword.yml.
  loop: "{{ debian_host_service_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create service accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: true
  loop: "{{ debian_host_service_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Authorise service account keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_key }}"
    exclusive: true
  loop: "{{ debian_host_service_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Grant service account sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ item.name }}
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
    content: |
      # Managed by Ansible (debian_host role).
      {% for cmd in item.sudo_commands %}
      {{ item.name }} ALL=(root) NOPASSWD: {{ cmd }}
      {% endfor %}
  loop: "{{ debian_host_service_accounts | selectattr('sudo_commands', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Revoke sudo from service accounts without any grants
  ansible.builtin.file:
    path: /etc/sudoers.d/{{ item.name }}
    state: absent
  loop: "{{ debian_host_service_accounts | rejectattr('sudo_commands', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Give service accounts access to the directories they write to
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: directory
    owner: root
    group: "{{ item.0.name }}"
    mode: "2775"
  loop: "{{ debian_host_service_accounts | subelements('directories', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"
