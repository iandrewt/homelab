---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Read current timezone
  ansible.builtin.stat:
    path: /etc/localtime
  register: debian_host_current_timezone

- name: Set timezone
  ansible.builtin.command: timedatectl set-timezone {{ debian_host_timezone }}
  changed_when: true
  when: (debian_host_current_timezone.stat.lnk_target | default('')) != '/usr/share/zoneinfo/' + debian_host_timezone

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Local unattended-upgrades policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::SyslogEnable "true";
