---
- name: Write the primary interface's static ULA netplan config
  ansible.builtin.template:
    src: static_ula.yaml.j2
    dest: /etc/netplan/60-static-ula.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Apply netplan

- name: Apply the static ULA now
  ansible.builtin.meta: flush_handlers
