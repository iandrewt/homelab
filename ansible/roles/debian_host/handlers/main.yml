---
- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Reload and restart apt-daily-upgrade timer
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    daemon_reload: true
    state: restarted

- name: Apply netplan
  ansible.builtin.command: netplan apply
  changed_when: true
