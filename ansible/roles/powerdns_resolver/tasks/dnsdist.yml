---
# The packaged unit has no After=/Wants= on networking at all - on a cold boot it can
# start before the anycast address exists yet. setLocal() to a not-yet-present
# address throws, which aborts the rest of the Lua config script
- name: Ensure dnsdist's systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/dnsdist.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Make dnsdist wait for the network before starting
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnsdist.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      After=network-online.target
      Wants=network-online.target
  notify: Restart dnsdist

- name: Write dnsdist.conf
  ansible.builtin.template:
    src: dnsdist.conf.j2
    dest: /etc/dnsdist/dnsdist.conf
    owner: root
    group: _dnsdist
    mode: "0640"
    validate: dnsdist --check-config -C %s
  notify: Restart dnsdist

- name: Ensure dnsdist is running
  ansible.builtin.systemd:
    name: dnsdist
    state: started
    enabled: true
    daemon_reload: true
