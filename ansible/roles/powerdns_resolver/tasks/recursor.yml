---
- name: Write recursor.yml
  ansible.builtin.template:
    src: recursor.yml.j2
    dest: /etc/powerdns/recursor.yml
    owner: root
    group: root
    mode: "0640"
  notify: restart pdns-recursor

- name: Remove any legacy recursor.conf so it can't shadow the YAML file
  ansible.builtin.file:
    path: /etc/powerdns/recursor.conf
    state: absent

- name: Ensure pdns-recursor is running
  ansible.builtin.systemd:
    name: pdns-recursor
    state: started
    enabled: true
