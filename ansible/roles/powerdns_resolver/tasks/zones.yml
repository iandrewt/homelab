---
# A secondary transfers only a new serial, so a signed zone's moves with each weekly re-sign,
# or the secondary serves the old signatures past their expiry.
- name: Declare every zone, with its name servers and NetBox's SOA
  ansible.builtin.set_fact:
    powerdns_resolver_provision_zones: >-
      {{ (powerdns_resolver_provision_zones | default([])) + [{
           'name': item.name ~ '.',
           'kind': 'Master',
           'soa_edit_api': 'DEFAULT',
           'soa_edit': 'INCEPTION-INCREMENT' if item.dnssec_keys else '',
           'nameservers': item.nameservers | map('regex_replace', '$', '.') | list,
           'rrsets': [{
             'name': item.name ~ '.',
             'type': 'SOA',
             'ttl': item.soa_ttl,
             'records': [{'content': item.soa, 'disabled': false}],
           }],
         }] }}
  loop: "{{ powerdns_resolver_zones }}"
  loop_control:
    label: "{{ item.name }}"

# The PowerDNS role creates a zone's keys only while it has none, so a rollover is the
# operator's, not a converge's, and a restored key is imported only into a new zone.
- name: Declare each signed zone's keys
  ansible.builtin.set_fact:
    powerdns_resolver_provision_cryptokeys: >-
      {{ (powerdns_resolver_provision_cryptokeys | default([]))
         + (powerdns_resolver_restored_keys[item.name] | map('combine', {'zone': item.name ~ '.'}) | list
            if item.name in powerdns_resolver_restored_keys else
            item.dnssec_keys | map('combine', {'zone': item.name ~ '.', 'active': true}) | list) }}
  loop: "{{ powerdns_resolver_zones }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: "{{ powerdns_resolver_restored_keys | length > 0 }}"
