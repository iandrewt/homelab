---
- name: PowerDNS's DS wherever Cloudflare delegates a signed zone
  when: powerdns_resolver_cloudflare_api_token is not none
  run_once: true
  delegate_to: localhost
  become: false
  no_log: true
  vars:
    powerdns_resolver_cloudflare_api: https://api.cloudflare.com/client/v4
    powerdns_resolver_cloudflare_comment: PowerDNS's key, published by Ansible
  module_defaults:
    ansible.builtin.uri:
      headers:
        Authorization: "Bearer {{ powerdns_resolver_cloudflare_api_token }}"
  block:
    - name: Find the Cloudflare zone above each signed zone
      ansible.builtin.uri:
        url: "{{ powerdns_resolver_cloudflare_api }}/zones?name={{ item.name.split('.', 1) | last }}"
      loop: "{{ powerdns_resolver_trust_anchors | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: powerdns_resolver_cloudflare_parents
      check_mode: false

    - name: Read what Cloudflare holds at each zone's name
      ansible.builtin.uri:
        url: "{{ powerdns_resolver_cloudflare_api }}/zones/{{ item.json.result[0].id }}/dns_records?name={{ item.item.name }}&per_page=100"
      loop: "{{ powerdns_resolver_cloudflare_parents.results | selectattr('json.result') | list }}"
      loop_control:
        label: "{{ item.item.name }}"
      register: powerdns_resolver_cloudflare_records
      check_mode: false

    - name: Compare the delegated zones' DS with the primary's keys
      ansible.builtin.set_fact:
        powerdns_resolver_cloudflare_ds: >-
          {{ (powerdns_resolver_cloudflare_ds | default([])) + [{
               'zone_id': item.item.json.result[0].id,
               'name': item.item.item.name,
               'want': item.item.item.dsrecords | map('split', ' ') | list,
               'have': item.json.result | selectattr('type', 'eq', 'DS') | list,
             }] }}
      loop: "{{ powerdns_resolver_cloudflare_records.results }}"
      loop_control:
        label: "{{ item.item.item.name }}"
      when: item.json.result | selectattr('type', 'eq', 'NS') | length > 0

    - name: Publish each active key's DS
      ansible.builtin.uri:
        url: "{{ powerdns_resolver_cloudflare_api }}/zones/{{ item.0.zone_id }}/dns_records"
        method: POST
        body_format: json
        body:
          type: DS
          name: "{{ item.0.name }}"
          ttl: 3600
          comment: "{{ powerdns_resolver_cloudflare_comment }}"
          data:
            key_tag: "{{ item.1[0] | int }}"
            algorithm: "{{ item.1[1] | int }}"
            digest_type: "{{ item.1[2] | int }}"
            digest: "{{ item.1[3] }}"
      loop: "{{ powerdns_resolver_cloudflare_ds | default([]) | subelements('want') }}"
      loop_control:
        label: "{{ item.0.name }} {{ item.1[0] }}"
      when: item.1[3] | lower not in item.0.have | map(attribute='data.digest') | map('lower')
      changed_when: true

    - name: Withdraw the DS of keys the primary no longer has
      ansible.builtin.uri:
        url: "{{ powerdns_resolver_cloudflare_api }}/zones/{{ item.0.zone_id }}/dns_records/{{ item.1.id }}"
        method: DELETE
      loop: "{{ powerdns_resolver_cloudflare_ds | default([]) | subelements('have') }}"
      loop_control:
        label: "{{ item.0.name }} {{ item.1.data.key_tag }}"
      when:
        - item.1.comment == powerdns_resolver_cloudflare_comment
        - item.1.data.digest | lower not in item.0.want | map('last') | map('lower')
      changed_when: true
