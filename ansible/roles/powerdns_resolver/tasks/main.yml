---
- name: Assert this host's replication role is set
  ansible.builtin.assert:
    that: powerdns_resolver_role in ['primary', 'secondary']
    fail_msg: >-
      powerdns_resolver_role must be 'primary' or 'secondary', set per-host in
      host_vars. Refusing to guess.

- name: Assert the primary has an API key
  ansible.builtin.assert:
    that: powerdns_resolver_api_key is not none
    fail_msg: >-
      powerdns_resolver_api_key is unset - would otherwise render as the literal
      string "None" in pdns.conf. It comes from inventory/onepassword.yml.
  when: powerdns_resolver_role == 'primary'

- name: Assert the primary's API has somewhere to listen
  ansible.builtin.assert:
    that: powerdns_resolver_api_addresses | length > 0
    fail_msg: >-
      The primary's PowerDNS API Service names no addresses in NetBox; give it the server's
      authoritative ones, which HAProxy serves it on.
  when: powerdns_resolver_role == 'primary'

- name: Assert a signed zone for the health check to validate
  ansible.builtin.assert:
    that: powerdns_resolver_health_internal | length > 0
    fail_msg: No zone is signed, so the anycast health check has no answer to expect AD on.

- name: Install what it runs
  ansible.builtin.import_tasks: install.yml
  when: powerdns_resolver_install

- name: Zones and records
  ansible.builtin.import_tasks: zones.yml

- name: Write the peers' and the primary's addresses with their port
  ansible.builtin.set_fact:
    powerdns_resolver_peer_notify_addresses: >-
      {{ (powerdns_resolver_peer_addresses | reject('search', ':') | map('regex_replace', '$', ':53') | list)
         + (powerdns_resolver_peer_addresses | select('search', ':') | map('regex_replace', '^', '[')
            | map('regex_replace', '$', ']:53') | list) }}
    powerdns_resolver_primary_targets: >-
      {{ (powerdns_resolver_primary_addresses | reject('search', ':') | map('regex_replace', '$', ':53') | list)
         + (powerdns_resolver_primary_addresses | select('search', ':') | map('regex_replace', '^', '[')
            | map('regex_replace', '$', ']:53') | list) }}

- name: The authoritative server's configuration
  no_log: true
  ansible.builtin.set_fact:
    powerdns_resolver_pdns_config: >-
      {{
        {'local-address': powerdns_resolver_service_v4 ~ ',' ~ powerdns_resolver_service_v6,
         'query-local-address': powerdns_resolver_service_v4 ~ ',' ~ powerdns_resolver_service_v6,
         'local-port': 53}
        | combine(
            {'primary': true, 'webserver': true, 'webserver-address': '::1',
             'webserver-port': 8081, 'webserver-allow-from': '::1/128', 'api': true,
             'api-key': powerdns_resolver_api_key,
             'also-notify': powerdns_resolver_peer_notify_addresses | join(','),
             'allow-axfr-ips': powerdns_resolver_peer_addresses | join(',')}
            if powerdns_resolver_role == 'primary' else
            {'secondary': true, 'webserver': false, 'api': false,
             'allow-notify-from': powerdns_resolver_primary_addresses | join(',')}
          )
        | combine({'log-dns-queries': true, 'loglevel': 5} if powerdns_resolver_query_logging | bool else {})
      }}

- name: Build the recursor's forward_zones list
  ansible.builtin.set_fact:
    powerdns_resolver_forward_zones: >-
      {{ powerdns_resolver_zones | map(attribute='name') | map('community.general.dict_kv', 'zone')
         | map('combine', {'forwarders': ['[' ~ powerdns_resolver_service_v6 ~ ']:53']
                                         + powerdns_resolver_peer_notify_addresses,
                           'recurse': false})
         | list }}

- name: Configure the authoritative server, and provision its zones
  ansible.builtin.import_tasks: pdns.yml

- name: The API, over TLS
  ansible.builtin.import_tasks: api.yml
  when: powerdns_resolver_role == 'primary'

- name: DNSSEC trust anchors
  ansible.builtin.import_tasks: anchors.yml

# Before the recursor, whose handler follows dnsdist's: a fresh install's dnsdist holds 127.0.0.1:53
- name: Build dnsdist's listen address list, the health check's on loopback last
  ansible.builtin.set_fact:
    powerdns_resolver_dnsdist_locals: >-
      {{ ([powerdns_resolver_anycast_v4 ~ ':53'] if powerdns_resolver_anycast_v4 is not none else [])
         + (['[' ~ powerdns_resolver_anycast_v6 ~ ']:53'] if powerdns_resolver_anycast_v6 is not none else [])
         + ['127.0.0.1:' ~ powerdns_resolver_health_port] }}

- name: Configure dnsdist
  ansible.builtin.import_tasks: dnsdist.yml

- name: The recursor's configuration
  ansible.builtin.set_fact:
    powerdns_resolver_recursor_config:
      logging:
        quiet: "{{ not powerdns_resolver_query_logging | bool }}"
      dnssec:
        validation: "{{ powerdns_resolver_dnssec_validation }}"
        trustanchors: "{{ powerdns_resolver_trust_anchors | default([]) }}"
        negative_trustanchors: "{{ powerdns_resolver_negative_trust_anchors }}"
      incoming:
        listen: ['127.0.0.1', '::1']
        allow_from: "{{ powerdns_resolver_allow_from }}"
        # dnsdist's side; 127.0.0.1 stays header-free for a local dig
        proxy_protocol_from: ['::1']
      outgoing:
        source_address:
          - 0.0.0.0
          - "::"
      recursor:
        forward_zones: "{{ powerdns_resolver_forward_zones }}"

- name: Configure the recursor
  ansible.builtin.import_tasks: recursor.yml

- name: Apply its configuration before wiping its cache
  ansible.builtin.meta: flush_handlers

# The recursor caches the authoritative answers it forwarded for, so a changed record
# isn't seen until its TTL runs out otherwise.
- name: Wipe the primary's recursor cache for its own zones
  ansible.builtin.command:
    # `name$` wipes everything under name, not just the name itself
    cmd: >-
      rec_control wipe-cache
      {% for zone in powerdns_resolver_zones %}{{ zone.name }}$ {% endfor %}
  become: true
  when: powerdns_resolver_role == 'primary'
  changed_when: false
