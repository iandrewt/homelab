---
- name: Assert this host's replication role is set
  ansible.builtin.assert:
    that: powerdns_resolver_role in ['primary', 'secondary']
    fail_msg: >-
      powerdns_resolver_role must be 'primary' or 'secondary', set per-host in
      host_vars. Refusing to guess.

- name: Assert the primary has an API key
  ansible.builtin.assert:
    that: powerdns_resolver_api_key is not none
    fail_msg: >-
      powerdns_resolver_api_key is unset - would otherwise render as the literal
      string "None" in pdns.conf. Set it via a 1Password lookup in host_vars.
  when: powerdns_resolver_role == 'primary'

- name: Capture the ipam-generated zone/record provisioning lists
  ansible.builtin.set_fact:
    powerdns_resolver_provision_zones: "{{ pdns_provision_zones | default([]) }}"
    powerdns_resolver_provision_records: "{{ pdns_provision_records | default([]) }}"
    powerdns_resolver_provision_zone_metadata: "{{ pdns_provision_zone_metadata | default([]) }}"

- name: Compute the peer's notify addresses
  ansible.builtin.set_fact:
    powerdns_resolver_peer_notify_addresses: >-
      {{ (powerdns_resolver_peer_notify_addresses | default([]))
         + [(('[' ~ item ~ ']:53') if ':' in item else (item ~ ':53'))] }}
  loop: "{{ powerdns_resolver_peer_addresses }}"

- name: Compute the authoritative server's pdns_config
  ansible.builtin.set_fact:
    powerdns_resolver_pdns_config: >-
      {{
        {'local-address': static_ipv4 ~ ',' ~ static_ipv6, 'local-port': 53}
        | combine(
            {'primary': true, 'webserver': true, 'webserver-address': static_ipv6,
             'webserver-port': 8081, 'webserver-allow-from': '::/0', 'api': true,
             'api-key': powerdns_resolver_api_key,
             'also-notify': powerdns_resolver_peer_notify_addresses | join(','),
             'allow-axfr-ips': powerdns_resolver_peer_addresses | join(',')}
            if powerdns_resolver_role == 'primary' else
            {'secondary': true, 'webserver': false, 'api': false,
             'allow-notify-from': powerdns_resolver_peer_addresses | join(',')}
          )
      }}

- name: Build the recursor's forward_zones list
  ansible.builtin.set_fact:
    powerdns_resolver_forward_zones: >-
      {{ (powerdns_resolver_forward_zones | default([]))
         + [{'zone': item, 'forwarders': ['[' ~ static_ipv6 ~ ']:53'], 'recurse': false}] }}
  loop: "{{ [powerdns_resolver_zone] + powerdns_resolver_reverse_zones }}"

- name: Build the secondary's create-secondary-zone commands
  ansible.builtin.set_fact:
    powerdns_resolver_secondary_zone_commands: >-
      {{ (powerdns_resolver_secondary_zone_commands | default([]))
         + [{'args': 'create-secondary-zone ' ~ item ~ ' ' ~ (powerdns_resolver_peer_notify_addresses | join(' ')),
             'unless': 'list-zone ' ~ item}] }}
  loop: "{{ [powerdns_resolver_zone] + powerdns_resolver_reverse_zones }}"
  when: powerdns_resolver_role == 'secondary'

- name: Configure the authoritative server
  ansible.builtin.include_role:
    name: PowerDNS.pdns
  vars:
    pdns_config: "{{ powerdns_resolver_pdns_config }}"
    pdns_api_url: "http://[{{ static_ipv6 }}]:8081/api/v1/servers/localhost"
    pdns_backends:
      lmdb:
        filename: /var/lib/powerdns/pdns.lmdb
        shards: "{{ powerdns_resolver_lmdb_shards }}"
    pdns_lmdb_databases_locations:
      - /var/lib/powerdns/pdns.lmdb
    pdns_provision: true
    pdns_provision_zones: "{{ powerdns_resolver_provision_zones if powerdns_resolver_role == 'primary' else [] }}"
    pdns_provision_records: "{{ powerdns_resolver_provision_records if powerdns_resolver_role == 'primary' else [] }}"
    pdns_provision_zone_metadata: "{{ powerdns_resolver_provision_zone_metadata if powerdns_resolver_role == 'primary' else [] }}"
    pdns_provision_pdnsutils: "{{ powerdns_resolver_secondary_zone_commands | default([]) }}"

- name: Wipe the primary's recursor cache
  ansible.builtin.command:
    cmd: >-
      rec_control wipe-cache
      {{ ([powerdns_resolver_zone] + powerdns_resolver_reverse_zones) | map('regex_replace', '$', '$.') | join(' ') }}
  become: true
  when: powerdns_resolver_role == 'primary'
  changed_when: true

- name: Configure the recursor
  ansible.builtin.include_role:
    name: PowerDNS.pdns_recursor
  vars:
    pdns_rec_config:
      dnssec:
        validation: "{{ powerdns_resolver_dnssec_validation }}"
      incoming: >-
        {{ {'listen': ['127.0.0.1', '::1']}
           | combine({'allow_from': powerdns_resolver_allow_from} if powerdns_resolver_allow_from else {}) }}
      outgoing:
        source_address:
          - 0.0.0.0
          - "::"
      recursor:
        forward_zones: "{{ powerdns_resolver_forward_zones }}"

- name: Build dnsdist's anycast listen address list
  ansible.builtin.set_fact:
    powerdns_resolver_dnsdist_locals: >-
      {{ ([powerdns_resolver_anycast_v4 ~ ':53'] if powerdns_resolver_anycast_v4 is not none else [])
         + (['[' ~ powerdns_resolver_anycast_v6_ula ~ ']:53'] if powerdns_resolver_anycast_v6_ula is not none else [])
         + (['[' ~ powerdns_resolver_anycast_v6_gua ~ ']:53'] if powerdns_resolver_anycast_v6_gua is not none else []) }}

- name: Configure dnsdist
  ansible.builtin.include_role:
    name: PowerDNS.dnsdist
  vars:
    # dnsdist_locals itself has no way to pass setLocal/addLocal's options table
    # (PowerDNS/dnsdist-ansible#33)
    dnsdist_locals: []
    dnsdist_config: |-
      {% for local in powerdns_resolver_dnsdist_locals %}
      {{ 'setLocal' if loop.first else 'addLocal' }}("{{ local }}", {reusePort=true})
      {% endfor %}
    dnsdist_servers:
      - "[::1]:53"
    dnsdist_controlsocket: "::1"
    dnsdist_acls: "{{ [site_gua_prefix] if site_gua_prefix is defined else [] }}"
    # The packaged unit has no After=/Wants= on networking at all - on a cold boot
    # it can start before the anycast address exists yet, and setLocal() to a
    # not-yet-present address throws, aborting the rest of the Lua config script.
    dnsdist_unit_overrides:
      After: network-online.target
      Wants: network-online.target
