---
- name: Assert this host's replication role is set
  ansible.builtin.assert:
    that: powerdns_resolver_role in ['primary', 'secondary']
    fail_msg: >-
      powerdns_resolver_role must be 'primary' or 'secondary', set per-host in
      host_vars. Refusing to guess.

- name: Assert the primary has an API key
  ansible.builtin.assert:
    that: powerdns_resolver_api_key is not none
    fail_msg: >-
      powerdns_resolver_api_key is unset - would otherwise render as the literal
      string "None" in pdns.conf. Set it via a 1Password lookup in group_vars.
  when: powerdns_resolver_role == 'primary'

- name: Zones and records
  ansible.builtin.import_tasks: zones.yml

- name: Compute the peer's notify addresses
  ansible.builtin.set_fact:
    powerdns_resolver_peer_notify_addresses: >-
      {{ (powerdns_resolver_peer_addresses | reject('search', ':') | map('regex_replace', '$', ':53') | list)
         + (powerdns_resolver_peer_addresses | select('search', ':') | map('regex_replace', '^', '[')
            | map('regex_replace', '$', ']:53') | list) }}

# The API listens on `::`, where an IPv4 client arrives as ::ffff:a.b.c.d - and PowerDNS
# matches its ACL against that mapped form, never the plain IPv4 one.
- name: Write the API's allowed sources as the dual-stack socket reports them
  ansible.builtin.set_fact:
    powerdns_resolver_api_acl: >-
      ::1/128{% for net in powerdns_resolver_api_allow_from %},{{
        net if ':' in net else '::ffff:' ~ net.split('/')[0] ~ '/' ~ (96 + net.split('/')[1] | int)
      }}{% endfor %}

- name: Compute the authoritative server's pdns_config
  ansible.builtin.set_fact:
    powerdns_resolver_pdns_config: >-
      {{
        {'local-address': powerdns_resolver_service_v4 ~ ',' ~ powerdns_resolver_service_v6,
         'query-local-address': powerdns_resolver_service_v4 ~ ',' ~ powerdns_resolver_service_v6,
         'local-port': 53}
        | combine(
            {'primary': true, 'webserver': true, 'webserver-address': '::',
             'webserver-port': 8081, 'webserver-allow-from': powerdns_resolver_api_acl, 'api': true,
             'api-key': powerdns_resolver_api_key,
             'also-notify': powerdns_resolver_peer_notify_addresses | join(','),
             'allow-axfr-ips': powerdns_resolver_peer_addresses | join(',')}
            if powerdns_resolver_role == 'primary' else
            {'secondary': true, 'webserver': false, 'api': false,
             'allow-notify-from': powerdns_resolver_peer_addresses | join(',')}
          )
        | combine({'log-dns-queries': true, 'loglevel': 5} if powerdns_resolver_query_logging | bool else {})
      }}

- name: Build the recursor's forward_zones list
  ansible.builtin.set_fact:
    powerdns_resolver_forward_zones: >-
      {{ powerdns_resolver_zones | map(attribute='name') | map('community.general.dict_kv', 'zone')
         | map('combine', {'forwarders': ['[' ~ powerdns_resolver_service_v6 ~ ']:53']
                                         + powerdns_resolver_peer_notify_addresses,
                           'recurse': false})
         | list }}

- name: Build the secondary's create-secondary-zone commands
  ansible.builtin.set_fact:
    powerdns_resolver_secondary_zone_commands: >-
      {{ (powerdns_resolver_secondary_zone_commands | default([]))
         + [{'args': 'create-secondary-zone ' ~ item.name ~ ' ' ~ (powerdns_resolver_peer_notify_addresses | join(' ')),
             'unless': 'list-zone ' ~ item.name}] }}
  loop: "{{ powerdns_resolver_zones }}"
  loop_control:
    label: "{{ item.name }}"
  when: powerdns_resolver_role == 'secondary'

- name: Configure the authoritative server
  ansible.builtin.include_role:
    name: PowerDNS.pdns
  vars:
    pdns_config: "{{ powerdns_resolver_pdns_config }}"
    pdns_api_url: "http://[::1]:8081/api/v1/servers/localhost"
    pdns_backends:
      lmdb:
        filename: /var/lib/powerdns/pdns.lmdb
        shards: "{{ powerdns_resolver_lmdb_shards }}"
    pdns_lmdb_databases_locations:
      - /var/lib/powerdns/pdns.lmdb
    pdns_provision: true
    pdns_provision_zones: "{{ (powerdns_resolver_provision_zones | default([])) if powerdns_resolver_role == 'primary' else [] }}"
    pdns_provision_pdnsutils: "{{ powerdns_resolver_secondary_zone_commands | default([]) }}"
    pdns_provision_cryptokeys: "{{ (powerdns_resolver_provision_cryptokeys | default([])) if powerdns_resolver_role == 'primary' else [] }}"

- name: DNSSEC trust anchors
  ansible.builtin.import_tasks: anchors.yml

- name: DNSSEC delegations
  ansible.builtin.import_tasks: delegation.yml

- name: Configure the recursor
  ansible.builtin.include_role:
    name: PowerDNS.pdns_recursor
  vars:
    pdns_rec_config:
      logging:
        quiet: "{{ not powerdns_resolver_query_logging | bool }}"
      dnssec:
        validation: "{{ powerdns_resolver_dnssec_validation }}"
        trustanchors: "{{ powerdns_resolver_trust_anchors | default([]) }}"
        negative_trustanchors: "{{ powerdns_resolver_negative_trust_anchors }}"
      incoming:
        listen: ['127.0.0.1', '::1']
        allow_from: "{{ powerdns_resolver_allow_from }}"
        # dnsdist's side; 127.0.0.1 stays header-free for a local dig
        proxy_protocol_from: ['::1']
      outgoing:
        source_address:
          - 0.0.0.0
          - "::"
      recursor:
        forward_zones: "{{ powerdns_resolver_forward_zones }}"

# The recursor caches the authoritative answers it forwarded for, so a changed record
# isn't seen until its TTL runs out otherwise.
- name: Wipe the primary's recursor cache for its own zones
  ansible.builtin.command:
    # `name$` wipes everything under name, not just the name itself
    cmd: >-
      rec_control wipe-cache
      {% for zone in powerdns_resolver_zones %}{{ zone.name }}$ {% endfor %}
  become: true
  when: powerdns_resolver_role == 'primary'
  changed_when: false

- name: Build dnsdist's anycast listen address list
  ansible.builtin.set_fact:
    powerdns_resolver_dnsdist_locals: >-
      {{ ([powerdns_resolver_anycast_v4 ~ ':53'] if powerdns_resolver_anycast_v4 is not none else [])
         + (['[' ~ powerdns_resolver_anycast_v6 ~ ']:53'] if powerdns_resolver_anycast_v6 is not none else []) }}

- name: Configure dnsdist
  ansible.builtin.include_role:
    name: PowerDNS.dnsdist
  vars:
    # dnsdist_locals itself has no way to pass setLocal/addLocal's options table
    # (PowerDNS/dnsdist-ansible#33)
    dnsdist_locals: []
    dnsdist_config: |-
      {% for local in powerdns_resolver_dnsdist_locals %}
      {{ 'setLocal' if loop.first else 'addLocal' }}("{{ local }}", {reusePort=true})
      {% endfor %}
      {% if powerdns_resolver_query_logging | bool %}
      -- First, so no other rule's answer goes unlogged
      addAction(AllRule(), LogAction("", false, false, false, false))
      addResponseAction(AllRule(), LogResponseAction("", false, false, false))
      {% endif %}
      {% if not powerdns_resolver_cross_site_ipv6 %}
      {%   for owner in powerdns_resolver_sites.values() if owner.forward_zone %}
      {%     set others = powerdns_resolver_sites.values() | rejectattr('slug', 'eq', owner.slug)
                          | map(attribute='vlans') | map('dict2items') | flatten | map(attribute='value') %}
      {%     set clients = (others | map(attribute='ipv4') | list) + (others | map(attribute='ipv6') | select | list) %}
      {%     set zone = (powerdns_resolver_zones | selectattr('name', 'eq', owner.forward_zone) | first) %}
      {%     if clients %}
      -- {{ owner.slug }}'s IPv6 addresses aren't reachable from another site
      do
        local clients = newNMG()
      {%       for net in clients %}
        clients:addMask("{{ net }}")
      {%       endfor %}
        local zone = newSuffixMatchNode()
        zone:add("{{ owner.forward_zone }}.")
        addAction(
          AndRule({QTypeRule(DNSQType.AAAA), SuffixMatchNodeRule(zone), NetmaskGroupRule(clients)}),
          NegativeAndSOAAction(false, "{{ owner.forward_zone }}.", 300, "{{ zone.nameservers | first }}.",
                               "hostmaster.{{ owner.forward_zone }}.", 1, 3600, 600, 86400, 300)
        )
      end
      {%     endif %}
      {%   endfor %}
      {% endif %}
    dnsdist_servers:
      - '{address="[::1]:53", useProxyProtocol=true, healthCheckMode="lazy", lazyHealthCheckMode="TimeoutOnly"}'
    dnsdist_controlsocket: "::1"
    # addACL appends, so dnsdist's built-in private ranges still apply - this only adds
    # the site's public prefix, which those defaults can't know about.
    dnsdist_acls: "{{ [powerdns_resolver_gua_prefix] if powerdns_resolver_gua_prefix else [] }}"
