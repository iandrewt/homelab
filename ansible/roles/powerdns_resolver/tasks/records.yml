---
- name: Apply DNS records from ipam.yaml (primary)
  ansible.builtin.uri:
    url: "http://{{ static_ipv4 }}:8081/api/v1/servers/localhost/zones/{{ powerdns_resolver_zone }}"
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_resolver_api_key }}"
    body_format: json
    body:
      rrsets: "{{ dns_records }}"
    status_code: 204
  when:
    - powerdns_resolver_role == 'primary'
    - dns_records is defined
  changed_when: true
