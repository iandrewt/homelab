---
- name: Write pdns.conf
  ansible.builtin.template:
    src: pdns.conf.j2
    dest: /etc/powerdns/pdns.conf
    owner: root
    group: pdns
    mode: "0640"
  notify: Restart pdns

# become_user: pdns throughout this file - pdnsutil writes directly to the lmdb backend
# files, and pdns_server itself runs as the unprivileged pdns user. Anything pdnsutil
# creates as root, pdns_server then can't open.
- name: Create zones (primary)
  ansible.builtin.command:
    cmd: pdnsutil create-zone {{ item }}
  become: true
  become_user: pdns
  loop: "{{ [powerdns_resolver_zone] + powerdns_resolver_reverse_zones }}"
  register: powerdns_resolver_create_zone
  failed_when:
    - powerdns_resolver_create_zone.rc != 0
    - "'exists already' not in powerdns_resolver_create_zone.stderr"
  changed_when: powerdns_resolver_create_zone.rc == 0
  when: powerdns_resolver_role == 'primary'

- name: Create secondary zones
  ansible.builtin.command:
    cmd: >-
      pdnsutil create-secondary-zone {{ item }}
      {{ powerdns_resolver_peer_address }}:53
  become: true
  become_user: pdns
  loop: "{{ [powerdns_resolver_zone] + powerdns_resolver_reverse_zones }}"
  register: powerdns_resolver_create_secondary_zone
  failed_when:
    - powerdns_resolver_create_secondary_zone.rc != 0
    - "'exists already' not in powerdns_resolver_create_secondary_zone.stderr"
  changed_when: powerdns_resolver_create_secondary_zone.rc == 0
  when: powerdns_resolver_role == 'secondary'

- name: Set zone kind to primary
  ansible.builtin.command:
    cmd: pdnsutil set-kind {{ item }} primary
  become: true
  become_user: pdns
  loop: "{{ [powerdns_resolver_zone] + powerdns_resolver_reverse_zones }}"
  when: powerdns_resolver_role == 'primary'
  changed_when: false

- name: Set a real SOA (primary)
  ansible.builtin.command:
    cmd: >-
      pdnsutil replace-rrset {{ item }} @ SOA 3600
      "{{ inventory_hostname }}.{{ powerdns_resolver_zone }}. hostmaster.{{ powerdns_resolver_zone }}. 1 10800 3600 604800 3600"
  become: true
  become_user: pdns
  loop: "{{ [powerdns_resolver_zone] + powerdns_resolver_reverse_zones }}"
  when: powerdns_resolver_role == 'primary'
  changed_when: true

- name: Ensure NS records exist at the zone apex, for every resolver (primary)
  ansible.builtin.command:
    cmd: >-
      pdnsutil replace-rrset {{ item }} @ NS 3600
      {{ dns_resolver_ns_fqdns | join(' ') }}
  become: true
  become_user: pdns
  loop: "{{ [powerdns_resolver_zone] + powerdns_resolver_reverse_zones }}"
  when: powerdns_resolver_role == 'primary'
  changed_when: true

# Without this, API writes (records.yml) don't bump the SOA serial.
- name: Set SOA-EDIT-API so API writes bump the serial (primary)
  ansible.builtin.command:
    cmd: pdnsutil set-meta {{ item }} SOA-EDIT-API DEFAULT
  become: true
  become_user: pdns
  loop: "{{ [powerdns_resolver_zone] + powerdns_resolver_reverse_zones }}"
  when: powerdns_resolver_role == 'primary'
  changed_when: false

- name: Ensure pdns is running
  ansible.builtin.systemd:
    name: pdns
    state: started
    enabled: true
