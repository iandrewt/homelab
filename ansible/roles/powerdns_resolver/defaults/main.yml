---
powerdns_resolver_role: ~  # "primary" or "secondary"

powerdns_resolver_lmdb_shards: 1

powerdns_resolver_api_key: ~

powerdns_resolver_api_allow_from: []

powerdns_resolver_dnssec_validation: validate

powerdns_resolver_query_logging: false

# The primary's API, which the control node reads the signed zones' DS records from
powerdns_resolver_primary_api_url: ~
powerdns_resolver_primary_api_key: ~

# The other servers: the primary notifies them and lets them transfer; recursors forward to them
powerdns_resolver_peer_addresses: []
# The primary's: a secondary transfers from them and takes notifies from nothing else
powerdns_resolver_primary_addresses: []

powerdns_resolver_service_v4: ~
powerdns_resolver_service_v6: ~

powerdns_resolver_anycast_v4: ~
powerdns_resolver_anycast_v6: ~

# Checked against the client in dnsdist's proxy header, so anything dnsdist let in. The
# recursor listens on loopback alone: who may ask the resolvers is dnsdist's ACL, not this.
powerdns_resolver_allow_from: [0.0.0.0/0, "::/0"]

# Who may ask, as CIDRs: dnsdist refuses everyone else
powerdns_resolver_acl: []

# [{name, nameservers, soa, soa_ttl}]
powerdns_resolver_zones: []

# The anycast health check, through dnsdist on loopback: a signed internal zone, and a signed
# public name that withdraws only while a root server answers
powerdns_resolver_health_port: 5300
powerdns_resolver_health_internal: >-
  {{ powerdns_resolver_zones | rejectattr('dnssec_keys', 'eq', []) | map(attribute='name') | first | default('') }}
powerdns_resolver_health_public: "."
powerdns_resolver_health_roots: [198.41.0.4, "2001:503:ba3e::2:30", 193.0.14.129, "2001:7fd::1"]

# {zone: [{keytype, privatekey, active, published}]}, for a rebuilt primary: `homelab dns keys
# restore` runs the play with them in its environment
powerdns_resolver_restored_keys: "{{ lookup('env', 'POWERDNS_RESOLVER_RESTORED_KEYS') | default('{}', true) | from_json }}"
