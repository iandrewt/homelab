---
- name: Let services bind addresses the host doesn't hold yet
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/60-nonlocal-bind.conf
  loop:
    - net.ipv4.ip_nonlocal_bind
    - net.ipv6.ip_nonlocal_bind

- name: Write the service and anycast addresses' netplan config
  ansible.builtin.template:
    src: addresses.yaml.j2
    dest: /etc/netplan/90-bgp-addresses.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Apply netplan
