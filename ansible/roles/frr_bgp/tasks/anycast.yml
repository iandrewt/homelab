---
- name: Write the anycast unit
  ansible.builtin.template:
    src: anycast.service.j2
    dest: /etc/systemd/system/anycast.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart anycast

- name: Make the health loop's directory
  ansible.builtin.file:
    path: /usr/libexec/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: frr_bgp_install

- name: Install the health loop
  ansible.builtin.copy:
    src: anycast-check
    dest: /usr/libexec/homelab/anycast-check
    owner: root
    group: root
    mode: "0755"
  when: frr_bgp_install
  notify: Restart anycast-check

- name: Write the health loop's unit
  ansible.builtin.template:
    src: anycast-check.service.j2
    dest: /etc/systemd/system/anycast-check.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart anycast-check

- name: Raise anycast0 whenever this host is healthy
  ansible.builtin.systemd_service:
    name: anycast-check.service
    enabled: true
    state: started
    daemon_reload: true
