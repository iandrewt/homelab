---
- name: Restart frr
  ansible.builtin.systemd:
    name: frr
    state: restarted

- name: Apply netplan
  ansible.builtin.command: netplan apply
  changed_when: true

- name: Restart anycast
  ansible.builtin.command: systemctl try-restart anycast.service  # noqa: command-instead-of-module
  changed_when: true
