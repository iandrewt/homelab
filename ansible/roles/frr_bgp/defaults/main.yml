---
# No sensible defaults for these
frr_bgp_local_asn: ~
frr_bgp_peer_asn: ~
frr_bgp_peer_address: ~  # the router's address on this VLAN
frr_bgp_community: ~

frr_bgp_service_addresses: []
frr_bgp_anycast_addresses: []
frr_bgp_anycast_service: ~
frr_bgp_anycast_needs: []

# Other members of this ASN for on-link routing
frr_bgp_siblings: []
frr_bgp_sibling_service_addresses: []

frr_bgp_router_id: "{{ frr_bgp_service_addresses | reject('search', ':') | first | default('') }}"
