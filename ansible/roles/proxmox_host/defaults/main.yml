---
proxmox_host_use_bonding: true

proxmox_host_uplink_nics: []
proxmox_host_bond_mode: 802.3ad
proxmox_host_bond_hash_policy: layer3+4

proxmox_host_mgmt_use_dhcp: true

proxmox_host_data_pool_enabled: false
proxmox_host_data_pool_name: data
proxmox_host_data_pool_ashift: 12

# Required (non-empty) whenever the pool is enabled. e.g. striped mirror pairs:
#   - type: mirror
#     disks: [/dev/disk/by-id/..., /dev/disk/by-id/...]
#   - type: mirror
#     disks: [/dev/disk/by-id/..., /dev/disk/by-id/...]
# Always /dev/disk/by-id paths, never /dev/sdX - device letters aren't stable across
# reboots/rescans, and a wrong disk here claims its entire contents.
proxmox_host_data_pool_vdevs: []

proxmox_host_tofu_user: "tofu@pve"
proxmox_host_tofu_role: PVEAdmin
proxmox_host_tofu_token_name: provisioning
