---
- name: List existing Proxmox users
  ansible.builtin.command: pveum user list --output-format json
  register: proxmox_host_pveum_users
  changed_when: false
  check_mode: false

- name: "Create the OpenTofu service account: {{ proxmox_host_tofu_user }}"
  ansible.builtin.command: pveum user add {{ proxmox_host_tofu_user }}
  changed_when: true
  when: proxmox_host_tofu_user not in (proxmox_host_pveum_users.stdout | from_json | map(attribute='userid'))

- name: List existing Proxmox roles
  ansible.builtin.command: pveum role list --output-format json
  register: proxmox_host_pveum_roles
  changed_when: false
  check_mode: false

- name: "Create the TofuUrlFetch role"
  ansible.builtin.command: pveum role add TofuUrlFetch --privs Sys.AccessNetwork
  changed_when: true
  when: "'TofuUrlFetch' not in (proxmox_host_pveum_roles.stdout | from_json | map(attribute='roleid'))"

- name: "Ensure TofuUrlFetch has the privileges PVEAdmin doesn't cover"
  ansible.builtin.command: pveum role modify TofuUrlFetch --privs Sys.AccessNetwork
  changed_when: true

- name: "List existing tokens for: {{ proxmox_host_tofu_user }}"
  ansible.builtin.command: pveum user token list {{ proxmox_host_tofu_user }} --output-format json
  register: proxmox_host_pveum_tokens
  changed_when: false
  check_mode: false

- name: "Create the API token: {{ proxmox_host_tofu_token_name }}"
  ansible.builtin.command: >-
    pveum user token add {{ proxmox_host_tofu_user }} {{ proxmox_host_tofu_token_name }}
    --privsep 1 --output-format json
  register: proxmox_host_pveum_new_token
  changed_when: true
  no_log: true
  when: proxmox_host_tofu_token_name not in (proxmox_host_pveum_tokens.stdout | from_json | map(attribute='tokenid'))

- name: "Grant {{ proxmox_host_tofu_role }} on / to the user"
  ansible.builtin.command: >-
    pveum aclmod / -user {{ proxmox_host_tofu_user }}
    -role {{ proxmox_host_tofu_role }}
  changed_when: false

- name: "Grant TofuUrlFetch on / to the user"
  ansible.builtin.command: >-
    pveum aclmod / -user {{ proxmox_host_tofu_user }}
    -role TofuUrlFetch
  changed_when: false

- name: "Grant PVEDatastoreAdmin on /storage to the user"
  ansible.builtin.command: >-
    pveum aclmod /storage -user {{ proxmox_host_tofu_user }}
    -role PVEDatastoreAdmin
  changed_when: false

- name: "Grant {{ proxmox_host_tofu_role }} on / to the token"
  ansible.builtin.command: >-
    pveum aclmod / -token {{ proxmox_host_tofu_user }}!{{ proxmox_host_tofu_token_name }}
    -role {{ proxmox_host_tofu_role }}
  changed_when: false

- name: "Grant TofuUrlFetch on / to the token"
  ansible.builtin.command: >-
    pveum aclmod / -token {{ proxmox_host_tofu_user }}!{{ proxmox_host_tofu_token_name }}
    -role TofuUrlFetch
  changed_when: false

- name: "Grant PVEDatastoreAdmin on /storage to the token"
  ansible.builtin.command: >-
    pveum aclmod /storage -token {{ proxmox_host_tofu_user }}!{{ proxmox_host_tofu_token_name }}
    -role PVEDatastoreAdmin
  changed_when: false

# The secret is shown exactly once, at creation, and Proxmox never returns it again -
# it has to be captured here or the token is useless and has to be recreated.
- name: Show the new token secret (save it into 1Password now)  # noqa: no-handler
  ansible.builtin.debug:
    msg: "{{ (proxmox_host_pveum_new_token.stdout | from_json).value }}"
  when: proxmox_host_pveum_new_token is changed
