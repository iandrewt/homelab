---
# The "import" content type (needed by OpenTofu's proxmox_download_file + a VM disk's
# import_from, tofu/envs/alfheim/main.tf) isn't enabled on "local" by default - has to
# be added to the storage's existing content list, not just assumed present.
- name: Read local storage's current content types
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      awk '/^dir: local$/{f=1} f && /^\s+content /{print $2; exit}' /etc/pve/storage.cfg
    executable: /bin/bash
  changed_when: false
  register: proxmox_host_local_storage_content

- name: Allow the "import" content type on "local" storage
  ansible.builtin.command:
    cmd: >-
      pvesm set local --content
      {{ (proxmox_host_local_storage_content.stdout.split(',') + ['import']) | unique | sort | join(',') }}
  when: "'import' not in proxmox_host_local_storage_content.stdout.split(',')"
