---
- name: Read local storage's current content types
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      awk '/^dir: local$/{f=1} f && /^\s+content /{print $2; exit}' /etc/pve/storage.cfg
    executable: /bin/bash
  changed_when: false
  register: proxmox_host_local_storage_content

- name: Allow the "import" and "snippets" content types on "local" storage
  ansible.builtin.command:
    cmd: >-
      pvesm set local --content
      {{ (proxmox_host_local_storage_content.stdout.split(',') + ['import', 'snippets']) | unique | sort | join(',') }}
  changed_when: true
  when: >-
    'import' not in proxmox_host_local_storage_content.stdout.split(',') or
    'snippets' not in proxmox_host_local_storage_content.stdout.split(',')
