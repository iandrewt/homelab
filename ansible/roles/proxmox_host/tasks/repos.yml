---
- name: Disable the enterprise repo
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
    line: "Enabled: no"
    insertafter: EOF

- name: Disable the Ceph repo
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/ceph.sources
    line: "Enabled: no"
    insertafter: EOF

- name: Add the no-subscription repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
  notify: Update apt cache
