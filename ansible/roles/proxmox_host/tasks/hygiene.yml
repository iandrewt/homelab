---
- name: Read current timezone
  ansible.builtin.stat:
    path: /etc/localtime
  register: proxmox_host_current_timezone

- name: Set timezone
  ansible.builtin.command: timedatectl set-timezone {{ proxmox_host_timezone }}
  changed_when: true
  when: (proxmox_host_current_timezone.stat.lnk_target | default('')) != '/usr/share/zoneinfo/' + proxmox_host_timezone

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Enable the periodic timer
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Origins-Pattern is a list-type apt.conf setting -- a later file's block only appends to
# it, never replaces it, so "security only" has to mean editing the vendor file's own list,
# not overriding it.
- name: Restrict unattended-upgrades to the security origin only
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^(\s*)"origin=Debian,codename=\$\{distro_codename\},label=Debian";$'
    line: '\1// "origin=Debian,codename=${distro_codename},label=Debian";  // disabled: non-security, see proxmox_host role'
    backrefs: true

# Scalar settings do override cleanly across files, unlike the list above.
- name: Never auto-reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
