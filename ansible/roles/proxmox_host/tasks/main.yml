---
- name: Repos
  ansible.builtin.import_tasks: repos.yml
  tags: [repos]
- name: OpenTofu API user
  ansible.builtin.import_tasks: api_user.yml
  tags: [api_user]
- name: Storage
  ansible.builtin.import_tasks: storage.yml
  tags: [storage]
- name: ZFS data pool
  ansible.builtin.import_tasks: zfs_data_pool.yml
  tags: [zfs_data_pool]
# Last, deliberately: everything above is safe to lose SSH partway through and resume.
# This one can cut your own access if it's wrong.
- name: Network
  ansible.builtin.import_tasks: network.yml
  tags: [network]
