---
# Debian bug: the shipped dhclient profile predates unix-socket mediation on newer kernels,
# so dhclient can't create the socket it needs and retries forever - hangs boot on any
# interface using inet dhcp. https://forum.proxmox.com/threads/apparmor-denies-dhclient-socket.176687/post-858404
- name: Add AppArmor ABI declaration for dhclient
  ansible.builtin.lineinfile:
    path: /etc/apparmor.d/usr.sbin.dhclient
    line: "abi <abi/3.0>,"
    insertbefore: "^#include <tunables/global>"
    firstmatch: true
  notify: Reload dhclient AppArmor profile

- name: Allow dhclient to create unix dgram sockets
  ansible.builtin.lineinfile:
    path: /etc/apparmor.d/local/usr.sbin.dhclient
    line: "  network unix dgram,"
    insertafter: EOF
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Reload dhclient AppArmor profile
