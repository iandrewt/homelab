---
- name: Assert uplink NICs are configured
  ansible.builtin.assert:
    that: proxmox_host_uplink_nics | length == (proxmox_host_use_bonding | ternary(2, 1))
    fail_msg: >-
      proxmox_host_uplink_nics doesn't match proxmox_host_use_bonding - set the real
      NIC name(s) for this host in host_vars (see ansible/discover-hardware.yml for
      real names/drivers). Refusing to guess.

- name: Assert the mgmt interface isn't also a bond/uplink member
  ansible.builtin.assert:
    that: proxmox_host_mgmt_interface not in proxmox_host_uplink_nics
    fail_msg: >-
      proxmox_host_mgmt_interface ({{ proxmox_host_mgmt_interface }}) is also listed in
      proxmox_host_uplink_nics - a NIC can't be both a bond member and the dedicated
      mgmt link.
  when: proxmox_host_mgmt_interface | length > 0

- name: Write /etc/network/interfaces
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: "0644"
    validate: ifup -s -a -i %s
  notify: Apply networking
