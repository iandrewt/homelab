plugin: netbox.netbox.nb_inventory
validate_certs: true

token: "{{ lookup('secret', 'op://Network/NetBox API Token - Ansible/credential') }}"

# What NetBox allocates to Network, as its tenant
query_filters:
  - status: active
  - status: staged
  - tag: ansible-managed
  - tenant: network

groups:
  dns_resolver: "role is defined and role.slug == 'dns-resolver'"

# By primary address: the hosts that serve DNS can't be reached by a name they serve
ansible_host_dns_name: false
interfaces: true
