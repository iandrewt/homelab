# Secrets per group, resolved once per run by vars_plugins/onepassword.py. `{host}` is the
# host's name, `{site}` its site's slug in NetBox, `{primary_site}` the slug of the zones' primary's.
dns_resolver:
  powerdns_api_key: op://Network/PowerDNS API Key - {site}/credential
  powerdns_primary_api_key: op://Network/PowerDNS API Key - {primary_site}/credential
