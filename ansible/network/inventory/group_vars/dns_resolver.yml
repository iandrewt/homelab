---
dns_resolver: "{{ netbox_site.dns.servers[inventory_hostname] }}"
# Zones replicate across every site's servers
dns_resolver_all: >-
  {{ netbox_sites.values() | map(attribute='dns') | map(attribute='servers')
     | map('dict2items') | flatten | items2dict }}
dns_resolver_primary_name: >-
  {{ dns_resolver_all | dict2items | selectattr('value.primary') | map(attribute='key') | first }}
dns_resolver_primary: "{{ dns_resolver_all[dns_resolver_primary_name] }}"
dns_resolver_peers: >-
  {{ dns_resolver_all | dict2items | rejectattr('key', 'eq', inventory_hostname)
     | map(attribute='value') | list }}
dns_resolver_vlan: "{{ netbox_site.vlans[dns_resolver.vlan] }}"

# On an image-based host, what it runs
extensions_enabled: [frr, pdns, pdns-recursor, dnsdist, haproxy]

frr_bgp_local_asn: "{{ dns_resolver.asn }}"
frr_bgp_peer_asn: "{{ netbox_site.router_asn }}"
frr_bgp_peer_address: "{{ dns_resolver_vlan.gateway_ipv4 }}"
frr_bgp_gateways: "{{ [dns_resolver_vlan.gateway_ipv4, dns_resolver_vlan.gateway_ipv6] | select | list }}"

frr_bgp_service_addresses: "{{ [dns_resolver.ipv4, dns_resolver.ipv6] | select | list }}"
frr_bgp_anycast_addresses: >-
  {{ [netbox_site.dns.recursor.ipv4, netbox_site.dns.recursor.ipv6] | select | list }}
frr_bgp_anycast_service: dnsdist.service
frr_bgp_anycast_needs: [pdns-recursor.service, pdns.service]
frr_bgp_anycast_check: >-
  /usr/libexec/homelab/dns-health {{ powerdns_resolver_health_port }} {{ powerdns_resolver_health_internal }}
  {{ powerdns_resolver_health_public }} {{ powerdns_resolver_health_roots | join(' ') }}

powerdns_resolver_anycast_v4: "{{ netbox_site.dns.recursor.ipv4 }}"
powerdns_resolver_anycast_v6: "{{ netbox_site.dns.recursor.ipv6 }}"
powerdns_resolver_service_v4: "{{ dns_resolver.ipv4 }}"
powerdns_resolver_service_v6: "{{ dns_resolver.ipv6 }}"
powerdns_resolver_acl: >-
  {{ netbox_site.services.recursor.values() | map(attribute='sources')
     | map(attribute='ipv4') | flatten | unique | list
   + netbox_site.services.recursor.values() | map(attribute='sources')
     | map(attribute='ipv6') | flatten | unique | list }}

powerdns_resolver_peer_addresses: >-
  {{ dns_resolver_peers | map(attribute='ipv4') | select | list
   + dns_resolver_peers | map(attribute='ipv6') | select | list }}
powerdns_resolver_primary_addresses: "{{ [dns_resolver_primary.ipv4, dns_resolver_primary.ipv6] | select | list }}"

powerdns_resolver_role: "{{ 'primary' if dns_resolver.primary else 'secondary' }}"

dns_resolver_api: "{{ netbox_site.services[inventory_hostname]['PowerDNS API'] }}"
powerdns_resolver_api_addresses: "{{ dns_resolver_api.addresses }}"
powerdns_resolver_api_port: "{{ dns_resolver_api.ports | first }}"
powerdns_resolver_api_allow_from: >-
  {{ ['0.0.0.0/0', '::/0'] if dns_resolver_api.sources.internet
     else dns_resolver_api.sources.ipv4 + dns_resolver_api.sources.ipv6 }}
powerdns_resolver_api_pinned: "{{ dns_resolver_api.certificate }}"

powerdns_resolver_api_key: "{{ powerdns_api_key }}"
powerdns_resolver_primary_api_key: "{{ powerdns_primary_api_key }}"
powerdns_resolver_primary_host: "{{ dns_resolver_primary_name }}"

powerdns_resolver_zones: "{{ netbox_zones }}"
powerdns_resolver_health_public: titmuss.zone

network_services:
  - "{{ netbox_site.services[inventory_hostname] | default({}) }}"
  - "{{ netbox_site.services.recursor }}"
host_firewall_needed:
  - { protocol: tcp, port: 22 }
  - { protocol: udp, port: 53, address: "{{ dns_resolver.ipv4 }}" }
  - { protocol: tcp, port: 53, address: "{{ dns_resolver.ipv4 }}" }
  - { protocol: udp, port: 53, address: "{{ dns_resolver.ipv6 }}" }
  - { protocol: tcp, port: 53, address: "{{ dns_resolver.ipv6 }}" }
  - { protocol: udp, port: 53, address: "{{ powerdns_resolver_anycast_v4 }}" }
  - { protocol: tcp, port: 53, address: "{{ powerdns_resolver_anycast_v4 }}" }
  - { protocol: udp, port: 53, address: "{{ powerdns_resolver_anycast_v6 }}" }
  - { protocol: tcp, port: 53, address: "{{ powerdns_resolver_anycast_v6 }}" }
