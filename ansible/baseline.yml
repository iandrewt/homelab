---
# Applied by every team's tree to its own hosts, by each one's OS
- name: Group by OS
  hosts: all
  tags: [always]
  tasks:
    - name: Fail a host whose OS has no baseline
      ansible.builtin.assert:
        that: ansible_facts['distribution'] in ['Debian']
        fail_msg: "{{ inventory_hostname }} runs {{ ansible_facts['distribution'] }}, which has no baseline"
        quiet: true

    - name: Group by distribution
      ansible.builtin.group_by:
        key: "{{ ansible_facts['distribution'] | lower }}"
      changed_when: false

    - name: Read which image this host was built from
      ansible.builtin.slurp:
        src: /usr/lib/homelab/image-release
      register: image_release
      failed_when: false

    # The bake is in `images` by its inventory; a host built from an image, by its release file
    - name: Group by the bake an image was laid over, and the image it was built as
      when: image_release.content is defined or 'images' in group_names
      vars:
        bake: >-
          bake_{{ ansible_facts['distribution'] | lower }}_{{ ansible_facts['distribution_major_version'] }}_{{
          ansible_facts['architecture'] }}
      block:
        - name: Group by bake
          ansible.builtin.group_by:
            key: "{{ bake }}"
            parents: images
          changed_when: false

        - name: Group by image
          ansible.builtin.group_by:
            key: >-
              image_{{ (image_release.content | b64decode).splitlines() | select('match', 'IMAGE_ID=')
                       | first | regex_replace('^IMAGE_ID=', '') | replace('-', '_') }}
            parents: "{{ bake }}"
          changed_when: false
          when: image_release.content is defined

        - name: Group by the image's family
          ansible.builtin.group_by:
            key: >-
              family_{{ (image_release.content | b64decode).splitlines() | select('match', 'HOMELAB_FAMILY=')
                        | first | regex_replace('^HOMELAB_FAMILY=', '') }}
            parents: images
          changed_when: false
          when: image_release.content is defined and 'HOMELAB_FAMILY=' in image_release.content | b64decode

- name: Debian
  hosts: debian:!family_ymir
  become: true
  roles:
    - homelab.debian.hardening
    - homelab.linux.sshd
    - homelab.linux.host

# Its image is its baseline: what the bake and the image wrote in /etc follows the image only while no host
# writes it, so a host writes what's its own alone
- name: Image-based, ymir
  hosts: family_ymir
  become: true
  roles:
    - homelab.linux.host
    - homelab.linux.extensions

- name: Built from an image
  hosts: images
  become: true
  tasks:
    # Its group_vars, image_<profile>.yml, say what else an image's hosts take
    - name: The image's own roles
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop: "{{ image_roles }}"
      tags: [always]
