[defaults]
inventory = inventory/netbox.yml
roles_path = roles
vars_plugins = vars_plugins
vars_plugins_enabled = host_group_vars, netbox, onepassword
lookup_plugins = lookup_plugins
host_key_checking = True
interpreter_python = auto_silent
force_handlers = True
no_target_syslog = True
stdout_callback = debug

[ssh_connection]
pipelining = True
# Ansible's own default, plus accept-new: one connection per host, so the 1Password agent
# is asked once per host rather than once per task
ssh_args = -C -o ControlMaster=auto -o ControlPersist=30m -o StrictHostKeyChecking=accept-new
