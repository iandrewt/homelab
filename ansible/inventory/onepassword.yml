# Secrets per group, resolved once per run by vars_plugins/onepassword.py. `{host}` is the
# host's name, `{site}` its site's slug in NetBox.
hypervisor:
  tofu_ssh_public_key: op://Homelab/Proxmox Tofu SSH key/public key

dns_resolver:
  powerdns_api_key: op://Homelab/{site} PowerDNS API key/credential
  cloudflare_api_token: op://Homelab/Ansible Cloudflare API token/credential
