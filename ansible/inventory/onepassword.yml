# Secrets per group, resolved once per run by vars_plugins/onepassword.py. `{host}` is the
# host's name, `{site}` its site's slug in NetBox.
hypervisor:
  tofu_ssh_public_key: op://Platform/SSH Key - Tofu/public key

dns_resolver:
  powerdns_api_key: op://Network/PowerDNS API Key - {site}/credential
