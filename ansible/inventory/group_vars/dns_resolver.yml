---
frr_bgp_local_asn: 65010
frr_bgp_peer_asn: 65000
frr_bgp_peer_address: "{{ gateway_ipv4 }}"

frr_bgp_anycast_v4: "{{ dns_anycast_v4 }}"
frr_bgp_anycast_v6_ula: "{{ dns_anycast_v6_ula }}"
frr_bgp_anycast_v6_gua: "{{ dns_anycast_v6_gua }}"
powerdns_resolver_anycast_v4: "{{ dns_anycast_v4 }}"
powerdns_resolver_anycast_v6_ula: "{{ dns_anycast_v6_ula }}"
powerdns_resolver_anycast_v6_gua: "{{ dns_anycast_v6_gua }}"

dns_resolver_peers: "{{ groups['dns_resolver'] | difference([inventory_hostname])
                        | map('extract', hostvars) | list }}"
powerdns_resolver_peer_addresses: "{{ dns_resolver_peers | map(attribute='static_ipv4') | list
                                    + dns_resolver_peers | map(attribute='static_ipv6') | list }}"
