---
dns_resolver: "{{ netbox_site.dns.servers[inventory_hostname] }}"
# Zones replicate across every site's servers
dns_resolver_all: >-
  {{ netbox_sites.values() | map(attribute='dns') | map(attribute='servers')
     | map('dict2items') | flatten | items2dict }}
dns_resolver_primary: >-
  {{ dns_resolver_all.values() | selectattr('primary') | first }}
dns_resolver_peers: >-
  {{ dns_resolver_all | dict2items | rejectattr('key', 'eq', inventory_hostname)
     | map(attribute='value') | list }}
dns_resolver_vlan: "{{ netbox_site.vlans[dns_resolver.vlan] }}"

frr_bgp_local_asn: "{{ dns_resolver.asn }}"
frr_bgp_peer_asn: "{{ netbox_site.router_asn }}"
frr_bgp_peer_address: "{{ dns_resolver_vlan.gateway_ipv4 }}"
frr_bgp_gateways: "{{ [dns_resolver_vlan.gateway_ipv4, dns_resolver_vlan.gateway_ipv6] | select | list }}"

frr_bgp_service_addresses: "{{ [dns_resolver.ipv4, dns_resolver.ipv6] | select | list }}"
frr_bgp_anycast_addresses: >-
  {{ [netbox_site.dns.recursor.ipv4, netbox_site.dns.recursor.ipv6] | select | list }}
frr_bgp_anycast_service: dnsdist.service
frr_bgp_anycast_needs: [pdns-recursor.service]

powerdns_resolver_anycast_v4: "{{ netbox_site.dns.recursor.ipv4 }}"
powerdns_resolver_anycast_v6: "{{ netbox_site.dns.recursor.ipv6 }}"
powerdns_resolver_service_v4: "{{ dns_resolver.ipv4 }}"
powerdns_resolver_service_v6: "{{ dns_resolver.ipv6 }}"
powerdns_resolver_acl: >-
  {{ netbox_site.services.recursor.values() | map(attribute='sources')
     | map(attribute='ipv4') | flatten | unique | list
   + netbox_site.services.recursor.values() | map(attribute='sources')
     | map(attribute='ipv6') | flatten | unique | list }}

powerdns_resolver_peer_addresses: >-
  {{ dns_resolver_peers | map(attribute='ipv4') | select | list
   + dns_resolver_peers | map(attribute='ipv6') | select | list }}
powerdns_resolver_primary_addresses: "{{ [dns_resolver_primary.ipv4, dns_resolver_primary.ipv6] | select | list }}"

powerdns_resolver_role: "{{ 'primary' if dns_resolver.primary else 'secondary' }}"

dns_resolver_api_sources: "{{ netbox_site.services[inventory_hostname]['PowerDNS API'].sources }}"
powerdns_resolver_api_allow_from: "{{ dns_resolver_api_sources.ipv4 + dns_resolver_api_sources.ipv6 }}"

powerdns_resolver_api_key: "{{ powerdns_api_key }}"
powerdns_resolver_primary_api_key: "{{ powerdns_primary_api_key }}"
powerdns_resolver_primary_api_url: >-
  {{ 'http://[%s]:8081/api/v1/servers/localhost' % dns_resolver_primary.ipv6
     if dns_resolver_primary.ipv6 else
     'http://%s:8081/api/v1/servers/localhost' % dns_resolver_primary.ipv4 }}

powerdns_resolver_zones: "{{ netbox_zones }}"
