---
# built-in on raspberry pi os
deb13cis_rule_1_1_1_10: false

# grub-only; the raspberry_pi_os role does each in cmdline.txt or fstab instead
deb13cis_rule_1_3_1_2: false
deb13cis_rule_1_4_2: false
deb13cis_rule_6_2_1_3: false
deb13cis_rule_6_2_1_4: false

# arm64 has no chown, lchown, create_module or query_module, which these two don't filter
# out - and auditctl stops at the first bad rule, so every rule after it goes unloaded
deb13cis_rule_6_2_3_19: false
deb13cis_rule_6_2_3_34: false

# raspi-firmware depends on rsync, so mask its service rather than remove the package
deb13cis_rsync_mask: true

# overkill for a Pi.
deb13cis_config_aide: false
deb13cis_rule_6_3_2: false
deb13cis_rule_6_3_3: false

# The Pi's kernel and firmware; and forky, which is pinned to audit alone - see raspberry_pi_os
debian_host_unattended_upgrade_extra_origins:
  - "origin=Raspberry Pi Foundation,codename=${distro_codename},label=Raspberry Pi Foundation"
  - "origin=Debian,codename=forky,label=Debian"
