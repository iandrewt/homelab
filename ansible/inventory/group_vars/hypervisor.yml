---
# Ansible reaches this node as root, using the key answer.toml planted at install, and
# Proxmox uses root SSH for migration and cluster work. CIS 5.1.21 would set this to `no`.
debian_host_sshd_options:
  PermitRootLogin: prohibit-password
deb13cis_rule_5_1_21: false

debian_host_service_accounts:
  - name: tofu
    comment: OpenTofu provider SSH access
    ssh_key: "{{ lookup('community.general.onepassword', 'Proxmox Tofu SSH key',
                        vault=onepassword_vault, field='public key') }}"
    directories:
      - /var/lib/vz/snippets

deb13cis_config_aide: false
deb13cis_rule_6_3_2: false
deb13cis_rule_6_3_3: false
