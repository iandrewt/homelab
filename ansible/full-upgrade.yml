---
- name: Deliberate apt full-upgrade pass
  hosts: all
  become: true
  # An upgrade restarts what a host serves, and a resolver's peer answers meanwhile
  serial: 1
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Full upgrade
      ansible.builtin.apt:
        upgrade: full

    - name: Check whether a reboot is needed
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: full_upgrade_reboot_required

    - name: Report
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} needs a reboot"
      when: full_upgrade_reboot_required.stat.exists
