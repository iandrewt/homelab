---
- name: Raspberry Pi OS boot configuration
  tags: [pi]
  hosts: raspberry_pi_os
  become: true
  roles:
    - raspberry_pi_os

- name: Proxmox node
  tags: [proxmox]
  hosts: hypervisor
  become: true
  roles:
    - proxmox_node

- name: CIS Debian 13 baseline
  tags: [cis]
  hosts: debian
  become: true
  pre_tasks:
    - name: Leave CIS alone unless this run selects it
      ansible.builtin.meta: end_play
      when: "'all' not in ansible_run_tags and 'cis' not in ansible_run_tags"
      tags: always
  roles:
    - DEBIAN13-CIS

- name: Debian host
  tags: [debian]
  hosts: debian
  become: true
  roles:
    - debian_host

- name: DNS resolvers
  tags: [resolvers]
  hosts: dns_resolver
  become: true
  roles:
    - frr_bgp
    - powerdns_resolver
