---
- name: Configure Proxmox hosts
  hosts: hypervisor
  become: true
  roles:
    - role: debian_host
      vars:
        debian_host_use_netplan: false  # Proxmox uses ifupdown2

- name: Configure DNS resolvers
  hosts: dns_resolver
  become: true
  roles:
    - debian_host
    - frr_bgp
    - powerdns_resolver
