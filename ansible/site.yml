---
- name: Raspberry Pi OS boot configuration
  tags: [pi]
  hosts: raspberry_pi_os
  become: true
  roles:
    - raspberry_pi_os

- name: CIS Debian 13 baseline
  tags: [cis]
  hosts: debian
  become: true
  roles:
    - DEBIAN13-CIS

- name: Configure Proxmox hosts
  tags: [hypervisor]
  hosts: hypervisor
  become: true
  roles:
    - debian_host

- name: Configure DNS resolvers
  tags: [resolvers]
  hosts: dns_resolver
  become: true
  roles:
    - debian_host
    - frr_bgp
    - powerdns_resolver
