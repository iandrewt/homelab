# Cilium speaks only to Talos's `workload` instance, over the node's veth pair. Talos's `fabric`
# instance carries the routes on to the router, communities intact - and the router accepts a
# route only inside its purpose's block *and* carrying its purpose's community.
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: talos-workload
spec:
  bgpInstances:
    - name: talos-workload
      localASN: ${cilium_asn}
      peers:
        - name: talos-workload
          peerASN: ${talos_workload_asn}
          peerAddress: ${talos_workload_address}
          peerConfigRef:
            name: talos-workload
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: talos-workload
spec:
  transport:
    peerPort: 179
    sourceInterface: ${cilium_veth}
  families:
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          advertise: talos-workload
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: talos-workload
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: pods
  labels:
    advertise: talos-workload
spec:
  advertisements:
    - advertisementType: CiliumPodIPPool
      selector:
        matchLabels:
          io.cilium.podippool.name: default
      attributes:
        communities:
          standard: ["64512:2"]
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: lb
  labels:
    advertise: talos-workload
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses: [LoadBalancerIP]
      selector:
        matchExpressions:
          - { key: homelab.io/exposure, operator: NotIn, values: [shared, external] }
      attributes:
        communities:
          standard: ["64512:3"]
    - advertisementType: Service
      service:
        addresses: [LoadBalancerIP]
      selector:
        matchLabels:
          homelab.io/exposure: shared
      attributes:
        communities:
          standard: ["64512:4"]
    - advertisementType: Service
      service:
        addresses: [LoadBalancerIP]
      selector:
        matchLabels:
          homelab.io/exposure: external
      attributes:
        communities:
          standard: ["64512:5"]
