# The nodes' ingress firewall: what Talos's allowed, and nothing else. Nodes are entities, not
# the `k8s` subnet - a CIDR rule never matches a node - and `cluster` is every node and pod.
# ICMPv6 other than echo is Cilium's, by RFC 4890; ICMP errors pass as related.
apiVersion: cilium.io/v2
kind: CiliumCIDRGroup
metadata:
  name: management
spec:
  externalCIDRs: ${management_cidrs}
---
apiVersion: cilium.io/v2
kind: CiliumCIDRGroup
metadata:
  name: dhcp-servers
spec:
  externalCIDRs: ${dhcp_servers_cidrs}
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-all
spec:
  nodeSelector: {}
  ingress:
    - fromEntities: [all]
      icmps:
        - fields:
            - { family: IPv4, type: EchoRequest }
            - { family: IPv6, type: EchoRequest }
    # Talos's DHCP client reads the router's replies off a packet socket, after the host firewall
    - fromCIDRSet:
        - cidrGroupRef: dhcp-servers
      toPorts:
        - ports: [{ port: "68", protocol: UDP }]
    - fromCIDRSet:
        - cidrGroupRef: management
      toPorts:
        - ports: [{ port: "50000", protocol: TCP }]
    - fromEntities: [host, remote-node]
      toPorts:
        - ports: [{ port: "50000", protocol: TCP }]
    - fromEntities: [cluster]
      toPorts:
        - ports:
            - { port: "10250", protocol: TCP }
            - { port: "4240", protocol: TCP }
            - { port: "4244", protocol: TCP }
    # TODO: remove once cilium/cilium#45565 is fixed - a backend's replies to Envoy miss
    # conntrack and are denied as new connections, on Envoy's ephemeral ports. Talos reserves
    # 50000-50001 out of the range for apid and trustd.
    - fromEntities: [cluster]
      toPorts:
        - ports:
            - { port: "32768", endPort: 49999, protocol: TCP }
            - { port: "50002", endPort: 60999, protocol: TCP }
    # Talos's DNS proxy, which CoreDNS forwards to
    - fromEntities: [cluster]
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-controlplane
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
  ingress:
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "50001", protocol: TCP }
            - { port: "2379", endPort: 2380, protocol: TCP }
    - fromCIDRSet:
        - cidrGroupRef: management
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - fromEntities: [cluster]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
