cluster:
  name: valhalla
  id: 1

# A changed ConfigMap does nothing until each reads it again
rollOutCiliumPods: true
operator:
  rollOutPods: true
envoy:
  rollOutPods: true

k8sServiceHost: localhost
k8sServicePort: 7445
kubeProxyReplacement: true

ipam:
  mode: multi-pool
  operator:
    autoCreateCiliumPodIPPools:
      default:
        ipv6:
          cidrs:
            - ${pods_ipv6}
          maskSize: 80
        ipv4:
          cidrs:
            - ${pods_ipv4}
          maskSize: 28
        allowFirstIP: true
        allowLastIP: true
ipv4:
  enabled: true
ipv6:
  enabled: true

routingMode: native
autoDirectNodeRoutes: true
enableIPv4Masquerade: false
enableIPv6Masquerade: false
installNoConntrackIptablesRules: true

bpf:
  datapathMode: netkit
  distributedLRU:
    enabled: true
  mapDynamicSizeRatio: 0.08
bpfClockProbe: true

bandwidthManager:
  enabled: true
  bbr: true

loadBalancer:
  algorithm: maglev
  mode: hybrid
  # virtio_net runs single-buffer XDP only below MTU 3506, and the k8s link is 9000
  acceleration: disabled

bgpControlPlane:
  enabled: true

# Talos's own ingress firewall drops what Cilium's proxy hands to the stack with its original
# destination - every L7 connection out of the cluster, and every Gateway
hostFirewall:
  enabled: true
# TODO: remove once host-firewall.yaml's verdicts are all allow
policyAuditMode: true

# Talos applies its CRDs before Cilium: the operator only looks for them when it starts
gatewayAPI:
  enabled: true

hubble:
  relay:
    enabled: true
  # Cilium's own certgen issues and renews these: Helm would re-key them on every upgrade
  tls:
    auto:
      method: cronJob

securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
