apiVersion: v1
kind: Namespace
metadata:
  name: intel-gpu
  labels:
    pod-security.kubernetes.io/enforce: privileged
    # xpumd watches every GPU on its node through an adminAccess claim
    resource.kubernetes.io/admin-access: "true"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: intel-gpu-resource-driver
spec:
  interval: 1h
  url: oci://ghcr.io/intel/intel-gpu-resource-driver-chart
  ref:
    tag: 0.12.1
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  interval: 1h
  releaseName: intel-gpu-resource-driver
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  valuesFrom:
    - kind: ConfigMap
      name: intel-gpu-resource-driver-values
