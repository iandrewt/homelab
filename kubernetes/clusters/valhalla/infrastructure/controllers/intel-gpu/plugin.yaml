apiVersion: v1
kind: Namespace
metadata:
  name: intel-gpu
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: intel-device-plugins
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/intel/intel-device-plugins-for-kubernetes.git
  ref:
    tag: v0.37.1
  ignore: |
    /*
    !/deployments/gpu_plugin/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: intel-gpu-plugin
  namespace: flux-system
spec:
  interval: 1h
  path: ./deployments/gpu_plugin
  prune: true
  wait: true
  targetNamespace: intel-gpu
  sourceRef:
    kind: GitRepository
    name: intel-device-plugins
  patches:
    - target:
        kind: DaemonSet
        name: intel-gpu-plugin
      patch: |
        - op: replace
          path: /spec/template/spec/nodeSelector
          value:
            node.homelab.io/gpu: arc
