kubeletPlugin:
  nodeSelector:
    node.homelab.io/gpu: arc
  # Only the VFIO DeviceClass needs the driver to rebind a GPU, and nothing here runs KubeVirt
  manageBinding:
    enabled: false

# Talos's containerd reads CDI specs from /run/cdi alone, and its /etc is read-only
cdi:
  staticPath: /run/cdi
  dynamicPath: /run/cdi

# Health monitoring, on by default, reads from xpumd
xpumdEnabled: true
xpumd:
  nodeSelector:
    node.homelab.io/gpu: arc
