enabledControllers:
  - cloud-node
  - cloud-node-lifecycle

# On the host network before there is a CNI, so a node is initialized as it joins rather
# than once Cilium is up - and its Proxmox API calls come from the node, not a pod
useDaemonSet: true
nodeSelector:
  node-role.kubernetes.io/control-plane: ""
dnsPolicy: Default
extraEnvs:
  - name: KUBERNETES_SERVICE_HOST
    value: localhost
  - name: KUBERNETES_SERVICE_PORT
    value: "7445"
