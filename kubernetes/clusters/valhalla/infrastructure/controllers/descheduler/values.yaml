# Spreads replicas back out once the nodes they belong on are up: a scheduler that only
# prefers spreading stacks them on whichever node was ready first, at bootstrap or after a drain
kind: Deployment
deschedulingInterval: 5m

deschedulerPolicy:
  profiles:
    - name: spread
      pluginConfig:
        # CoreDNS is system-critical, and the reason this is here
        - name: DefaultEvictor
          args:
            podProtections:
              defaultDisabled:
                - SystemCriticalPods
        - name: RemoveDuplicates
        - name: RemovePodsViolatingTopologySpreadConstraint
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint
