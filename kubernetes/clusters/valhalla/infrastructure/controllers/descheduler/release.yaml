apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/descheduler/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 1h
  releaseName: descheduler
  chart:
    spec:
      chart: descheduler
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
  valuesFrom:
    - kind: ConfigMap
      name: descheduler-values
