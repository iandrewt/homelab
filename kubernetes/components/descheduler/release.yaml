apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/descheduler/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 1h
  releaseName: descheduler
  chart:
    spec:
      chart: descheduler
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
  values:
    # Spreads replicas back out once the nodes they belong on are up, after a bootstrap or a drain
    kind: Deployment
    deschedulingInterval: 5m

    deschedulerPolicy:
      profiles:
        - name: spread
          pluginConfig:
            # CoreDNS is system-critical, and the reason this is here
            - name: DefaultEvictor
              args:
                podProtections:
                  defaultDisabled:
                    - SystemCriticalPods
            - name: RemoveDuplicates
            - name: RemovePodsViolatingTopologySpreadConstraint
          plugins:
            balance:
              enabled:
                - RemoveDuplicates
                - RemovePodsViolatingTopologySpreadConstraint
