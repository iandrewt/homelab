apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: proxmox-cloud-controller-manager
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/sergelogvinov/charts/proxmox-cloud-controller-manager
  ref:
    tag: 0.2.32
    digest: sha256:2e7fbb98e1554d198d28b0f1365d1391bc646664cbaba2628b7f3031c4a66308
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-cloud-controller-manager
  namespace: flux-system
spec:
  interval: 1h
  releaseName: proxmox-cloud-controller-manager
  targetNamespace: kube-system
  storageNamespace: kube-system
  chartRef:
    kind: OCIRepository
    name: proxmox-cloud-controller-manager
  valuesFrom:
    - kind: Secret
      name: proxmox-ccm-config
  values:
    enabledControllers:
      - cloud-node
      - cloud-node-lifecycle

    # On the host network, so a node is initialized as it joins, before there is a CNI
    useDaemonSet: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    dnsPolicy: Default
    extraEnvs:
      - name: KUBERNETES_SERVICE_HOST
        value: localhost
      - name: KUBERNETES_SERVICE_PORT
        value: "7445"
