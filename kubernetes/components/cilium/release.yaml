apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  url: oci://quay.io/cilium/charts/cilium
  ref:
    tag: 1.20.2
    digest: sha256:a7c12d330dd96bfcda3bf057b24be8f36566c34868265f930f776dff6f42d838
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  releaseName: cilium
  chartRef:
    kind: OCIRepository
    name: cilium
  values:
    cluster:
      name: ${cluster_name}
      id: ${cluster_id}

    # A changed ConfigMap does nothing until each reads it again
    rollOutCiliumPods: true
    operator:
      rollOutPods: true
    envoy:
      rollOutPods: true
      # TODO: back to ADS once cilium/cilium#49181 is fixed - a rejected first listener leaves
      # Envoy without network policy, and new pods on its node hang
      xdsMode: split

    k8sServiceHost: localhost
    k8sServicePort: 7445
    kubeProxyReplacement: true

    ipam:
      mode: multi-pool
    ipv4:
      enabled: true
    ipv6:
      enabled: true

    routingMode: native
    autoDirectNodeRoutes: true
    enableIPv4Masquerade: false
    enableIPv6Masquerade: false
    installNoConntrackIptablesRules: true

    bpf:
      datapathMode: netkit
      distributedLRU:
        enabled: true
      mapDynamicSizeRatio: 0.08
    bpfClockProbe: true

    bandwidthManager:
      enabled: true
      bbr: true

    loadBalancer:
      algorithm: maglev
      mode: hybrid
      # virtio_net runs single-buffer XDP only below MTU 3506, and the k8s link is 9000
      acceleration: disabled

    bgpControlPlane:
      enabled: true

    # Talos's own ingress firewall drops what Cilium's proxy hands to the stack with its original
    # destination - every L7 connection out of the cluster, and every Gateway
    hostFirewall:
      enabled: true

    # Talos applies its CRDs before Cilium: the operator only looks for them when it starts
    gatewayAPI:
      enabled: true

    hubble:
      relay:
        enabled: true
      # Cilium's own certgen issues and renews these: Helm would re-key them on every upgrade
      tls:
        auto:
          method: cronJob

    securityContext:
      capabilities:
        ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
