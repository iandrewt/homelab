# A Kustomization per component the cluster takes, with what the catalog says of it
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: fleet
  namespace: flux-system
spec:
  inputStrategy:
    name: Permute
  inputsFrom:
    - name: fleet-catalog
    - name: cluster
  resourcesTemplate: |
    <<- $taken := inputs.cluster.components >>
    <<- range $name := $taken >>
    <<- $component := index inputs.fleet_catalog.components $name >>
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: << $name >>
      namespace: flux-system
    spec:
      <<- with get $component "dependsOn" >>
      dependsOn:
        <<- range $dependency := . >>
        <<- if has $dependency $taken >>
        - name: << $dependency >>
        <<- end >>
        <<- end >>
      <<- end >>
      interval: 1h
      retryInterval: 1m
      path: ./components/<< $name >>
      prune: true
      wait: true
      sourceRef:
        kind: OCIRepository
        name: fleet
      postBuild:
        substituteFrom:
          - kind: ConfigMap
            name: flux-runtime-info
    <<- end >>
